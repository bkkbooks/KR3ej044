front:
  text: 幼科序大凡醫之為理有可以簡而明者有不可以簡而明者矧稚子何知將問之莫從問也且切之莫可切症變奇出治法多端尚示之以簡而其症不明其治有乖小兒之所以生死存亡系焉是誠簡之無可簡也萬先生育嬰書始以分門心訣繼以各髒髮揮終以痘疹科目反復論辨再三開導可謂無症不備無法不全無理不透者矣小兒不能言者言之而已悉其奧凡醫不能治者治之而已極其神世之讀是書者初視之未嘗不以為不簡也細體之究知其不可簡也先生誠求之心則苦矣先生保赤之心不朽矣是為敘漢陽恪齊張坦議撰於五知莊
