body:
  text: 卷之三水鏡訣夫陰陽運合男女成形已分九竅四肢乃生五臟六腑部位各分順逆難明若憑寸口之浮沉必乃橫亡於孩子須明虎口辨別三關參詳用藥必無差誤未至三歲止看虎口男左女右從第二指第一節名風關若脈見初交病第二節為氣關脈見則難治第三節為命關脈見則死又當辨其色若三關青四足驚三關赤水驚三關黑人驚紫色泄痢黃色雷驚三關脈通度是急驚之症必死余病可治或青或紅有紋如線一直者是乳食傷脾及發熱驚左右一樣者是驚與積齊發有三條或散是肺生風痰或似齁䶎聲有青是傷寒及嗽如紅火是瀉有黑相兼主下痢紅多白痢黑多是赤痢有紫相兼加渴不虛虎口脈紋亂乃氣不和也蓋脈紋見有色者曰黃紅紫青黑由其病甚色能加變如黃紅之色紅盛作紫紅紫之色紫盛作青紫青之色青盛作黑青黑之色至於純黑之色者不可治矣又當辨長珠形主夾積傷滯肚腹疼痛寒熱飲食不化來蛇形主中脘不和積氣攻刺臟腑不寧乾嘔去蛇形脾虛冷積泄瀉神困多睡弓反里形主感寒熱邪氣頭目昏重心神驚悸倦怠四肢稍冷小便赤色弓反外形主痰熱心神恍惚作熱夾驚夾食風癇證候鎗形主痰熱痰盛生風發搐驚風魚骨形主驚痰熱水字形主驚積熱煩躁心神迷悶夜啼痰盛口噤搐搦針形主心肺受熱熱極生風驚悸煩悶神困不食痰盛搐搦透關射指主驚風痰熱四症皆聚在胸膈不散透關射指主驚風惡候受驚傳入經絡風熱發生十死一生難治此十三位形脈悉有輕重察其病根則詳其症指掌形圖虎口者叉手處是也三關者二指三節是也風關第一節寅位是也氣關第二節卯位是也命關第三節辰位是也辰關指頭上節卯關指中節寅關指下節命關死候氣關病深風關易治末關命門中關氣候初關風候凡嬰兒生下一月至三歲以前須看虎口脈次指辰節為命關次氣關次風關所謂初得風關病猶可傳入氣命定難陳湯氏云小兒初生至五歲血氣未定呼吸至數太過必辨虎口脈色方可察病之的實男驗左手女驗右手蓋取左手屬陽男以陽為主右手屬陰女以陰為主然男女一身均具此陰陽左右兩手亦當參驗左手之紋病應心肝右手之紋病應肺脾知此消息又得變通之意驚風初得紋出虎口或在初關多是紅色傳至中關色赤而紫看病又傳過其色紫青病熱深重其色青黑而紋亂者病深重若見純黑危惡不治大抵紅者風熱輕赤者風熱甚紫者驚熱青者驚積青赤相半驚積風熱俱有主急驚風青而淡紫伸縮來去主慢驚風或紫系青系黑系隱隱相雜似出不出主慢脾風脈紋從寅關起不至卯關者病易治若連卯關者有病難治如寅關連卯侵過辰關者十難救一若脈紋小或短者看病不妨如紋勢彎曲入里者病雖重而症順猶可用力紋勢弓反出外駸駸靠於指甲者斷不可回其有三關紋如流珠流來三五點相連或形於面或形於身危惡尤甚入門候歌三首五指梢頭冷驚來不可安若逢中指熱必定是傷寒中指獨自冷麻痘症相傳女右男分左分明仔細看初起寅關淺紋侵過卯深生枝終不治辰位實難禁辨虎口指脈紋訣氣紋黃盛作紅紅盛作紫紫盛作青青盛變黑純黑則難治矣黃色無形者即安樂脈也紅若無形亦安寧脈也有前數樣形者即病之脈次第而變初作一點於氣多紅脈至風關其病危急純黑分明不可療治左有紅紋似線形定知發熱又兼驚右有雙紋如左狀脾傷驚積一齊生紋頭有似三叉樣肺氣生痰夜作聲青赤應是傷寒症只是空紅泄定生又歌虎口亂紋多須知氣不和色青驚積聚下乳泄如何青即慢驚發入掌內瘹多三關忽通過此候必沉疴指上辨青紋認是四足驚虎口脈青色是豬犬馬驚黑色因水撲黑脈見者因撲跌在水起赤色火人驚赤脈見是人驚或跌在火而起紫色多成瀉紫脈見者主泄痢黃色是雷驚黃脈見者因大雷聲著嚇曲反風還盛曲是傷寒並有乾熱彎弓食上蒸曲外是傷寒但看叉手處方可辨其形凡小兒三歲以上有病深重危急者指甲口鼻多作黑色蓋兒脈絕神困症候惡極雖有良藥斷斷乎不可保矣額印堂山根論歌額紅大熱燥青色有肝風印堂青色見人驚火則紅山根青隱隱驚遭是兩重若還斯處赤泄燥定相攻年壽論歌年上微黃為正色若平更陷夭難禁忽有黑色痢疾候霍亂吐泄黃色深小兒正面圖小兒腦背圖察形色之圖鼻準論歌鼻準微黃赤白平深黃燥黑死難生人中短縮吐因痢唇反黑候蛔必傾正口論歌正口常紅號曰平燥干脾熱積黃生白主失血黑繞口青黑驚風盡死形承漿兩眉論歌承漿青色食時驚黃多吐逆痢紅形煩躁夜啼青色吉久病眉紅死症真兩眼論歌白睛青色有肝風若是黃時有積攻或見黑睛黃色現傷寒病症此其宗風池氣池兩頤論歌風氣二池黃吐逆煩躁啼哭色鮮紅更有兩頤胚樣赤肺家客熱此非空兩太陽論歌太陽青色驚方始紅色赤淋萌孽起要知死症是如何青色從茲生入耳兩臉論歌兩臉黃為痰實咽青色客忤紅風熱傷寒赤色紅主淋二色請詳分兩頰兩頤金匱風門論歌吐蟲青色滯頤黃一色顧間兩自詳風門黑疝青驚水紋青金匱主驚狂觀形色總論凡看小兒疾病先觀形色而切脈次之蓋面部氣總見而五位青色者驚積不散欲發風候五位紅色者痰積壅盛驚悸不寧五位黃色者食積癥傷疳候痞癖五位白色者肺氣不實滑泄吐痢五位黑色者臟腑欲絕為疾危惡面青眼青肝之病面赤心之病面白肺之病面黃脾之病面黑腎之病先別其五臟各有所主次者稟受盈虧胎氣虛實陰陽二症補過泄多當救其失兼五臟六腑表裡各有相應若能辨其標本則神聖工巧矣五位所屬心為額南方火脾為鼻中央土腎為頦北方水肺為右頰西方金肝為左頰東方木命門部位圖部位歌中庭與天庭司空及印堂額角方廣處有病定存亡青黑驚風惡體和滑澤光不可陷兼損唇黑最難當青甚須憂急昏黯亦堪傷此是命門地醫師妙較量觀形色西江月凡觀小兒形色青筋肝熱生風兩腮紅赤熱相攻黃色脾虛取用黑氣腹疼中惡白為疳瘦生蟲如逢兩目赤重重此是南柯一夢要識小兒症候但將外貌推求黃浮肌削痞瘕瘤唇撮面青痛楚吐舌唇焦內熱昏昏好睡脾枯手掀足掣是驚由疳疾青筋大肚眼角眵生肝熱口邊涎出脾寒頭毛稀豎血將干胞腫脾家濕顯鼻孔黑焦肺熱耳輪枯燥腎傳胸高氣促肺炎炎熱憊囟門腫陷小兒精神忽減麵皮黃白無常必因乳食內成傷生冷油磨阻擋或致腸鳴泄痢或為瘧疾難當忽然膨脹漸羸尪癖積蟲疳四樣小兒麵皮紅赤兩腮恰似塗朱風寒外感事何如潮熱無時來去或作驚風症治或為斑毒驅除口乾啼哭淚如珠睡困昏昏不乳小兒病形各樣慢恁眼力消詳懷中畏縮怕風涼合面睡時熱瘴夜啼熱煩腹痛目直驚搐須防長吁短氣熱中藏痰喘上衝火旺要辨小兒死症囟門陷下成坑喉中拽鋸氣和痰目閉無神拘管口唇牙齦粉白手足恰似冰寒鴉聲口緊眼常翻不乳遺尿悶亂小兒脈法小兒一歲以上可以看脈以六至為平和七至八至為實熱三至四至為遲為虛弱西江月小兒尋常脈候一息六至平和七至八至熱生多三四虛寒病作九十連來雀啄一二動指成疴微虛緊數不差訛補泄分明用藥身熱脈浮可汗身寒脈細休攻喘咳緊數藥無功腫脹細微堪痛泄痢沉遲易愈痘出洪數宜從若還吐衄怕浮洪腹疼沉微拈弄小兒治法如足脛熱兩腮紅煩渴不止頭面好露揚手擲足大便閉小便黃身壯熱不退此宜涼解不可服熱補之藥如足脛冷面㿠白吐泄不止肚腹作痛身常偎人眼珠青口中冷氣潮熱往來不定此宜溫補不可服涼利之藥西江月小兒不宜熱藥兩腮俱帶緋紅手足壯熱火烘烘六脈浮洪亂動小便赤黃又澀大便秘結難通掀衣飲水喜當風煩渴鼻流血湧小兒不宜涼藥麵皮㿠白無精四肢厥冷似寒冰六脈浮微隱隱吃乳不消嘔吐糞如鴨屎頻頻神虛腹疼眼珠青病久成疳諸症小兒純陽之體陰陽不可偏傷常帶三分飢與涼此個孩兒易養大抵脾常不足有餘肝氣須防不寒不熱藥為良切忌妄行孟浪小兒何為難治古今號曰啞科脈無可視如之何口不能言病作父母時時驚怕醫人試驗誠多從容對症用方藥有甚難為捉摸凡小兒一歲以下有病者多是胎毒只宜解毒為急小兒二歲以上有病者多是食積只宜消積補脾而已其餘症治方略詳載各門之下故不重述
