body:
  text: 卷之四胎毒門凡小兒在月內有病者皆胎毒也並治其母小兒月內腸胃甚脆氣血未充若有微疾不可妄施補瀉恐臟腑一傷將貽患終身或致夭命矣可不戒哉如不得已而用湯丸毋伐天和中病即止又不可過劑也乳母服藥必別擇乳母而後可補可泄也若蓐母生兒之母謂之曰蓐自乳又不可亂投湯藥蓋産後之婦氣血甚虛有補無瀉苟兒有熱病而用涼藥則犯産後之禁必害其母如有溫補則反加小兒之熱又害其子醫者人之司命而可妄為乎必須斟酌謹慎勿損陰德凡小兒才生即死者急看兒口中懸雍齶上必有泡塞住即以手指摘破其泡速以軟絹拭血令淨若血入咽即死凡小兒初生氣絶不能啼者必因難産或因冒寒所致急以綿絮重裹其兒抱於懷中不可便斷臍帶卻把胞衣置銚中向炭火上煮之又作油炷點著於臍帶上往來燎之須臾熱氣由臍入腹便能啼方可洗浴斷帶若不如此急救之而先斷帶者多死不治凡小兒初生下被寒風所吹鼻塞服藥不得者用天南星為末生薑自然汁調成膏貼囟門上自愈凡小兒生後或月內或百日氣急喘滿目閉眼赤眵多神困呵缺遍身壯熱小便赤澀大便不通時復驚煩此胎熱也因母平日嗜食辛甘熱物貪服暖藥而致用涼驚丸黃連解毒湯治之黃連解毒湯黃連甘草木通生地連翹薄菏少許川芎陳皮燈心三根水煎服小兒生後覺口冷腹熱腸滑泄瀉昏昏多眠或夜多啼此胎寒也因母喜啖生冷或外感多服涼藥致傷胎氣理中丸勻氣散治之勻氣散桔梗陳皮各二錢砂仁五分茴香炒五分生薑炮二分粉草炙四分加木香二分共為細末每服一字棗湯調下凡小兒生下浮胖遍身紅色滿月以後漸漸瘦弱五心煩熱此名胎肥又有生下面無晶光身無血色目無精彩肌肉消削此名胎怯並內服八物湯外用沐浴法八物湯當歸川芎生地白芍炒人參白朮甘草白茯苓各等分薑棗引水煎服沐浴法天麻蠍梢硃砂各五分白礬青黛麝香少許烏梢蛇肉酒浸燒為末各三錢共研為細末每用三錢水三碗桃枝連葉一握同煎十沸待溫熱沐之慎勿沐背凡小兒生下遍身面目皆黃狀如金色身上壯熱大便不通小便如梔子汁乳食不思皆胎黃也因乳母受熱而傳於胎用地黃湯生地赤芍天花粉赤苓川芎當歸豬苓澤瀉木通甘草茵陳水煎溫服凡小兒生後壯熱翻眼握拳咬牙身腰強直涎潮嘔吐搐掣驚啼腮縮囟開或頰赤面青眼合更胎風眼合不可誤作慢脾風妄用湯藥要視其眉間氣色若紅赤鮮碧者可治若黯黑青黑者不治虎口指紋曲入里者可治出外者不治此因妊婦調食乖常飲酒嗜肉忿怒驚撲母有所觸胎必感之或外挾風邪有傷於胎故子乘母氣生下即病以至聖保命丹金銀燈心湯下至聖保命丹治小兒驚風內瘹腹肚堅硬睡不安夜多啼哭急慢驚風眼目上視手足搐掣不省人事者服之即效全蠍去毒十四個防風二錢白附子煨一錢南星炮用牛膽制蟬蛻去毒殭蠶炒去毒天麻各二錢辰砂另研一錢麝香五分上為末揉糯米飯丸如黃豆大金箔為衣每一丸鉤藤燈心湯磨下有熱加牛黃腦子硼砂又方加羌活二錢此藥常服鎮心化痰袖珍方云胎驚治法宜解散風邪利驚化痰調氣貼囟甚則以朱銀丸利之面青拳搐者宜服保命丹鉤藤散全蠍散初生嬰兒難以用藥凡有此候急取豬乳細研辰砂牛黃麝香各少許調抹入口中即愈矣全蠍散治胎驚癇諸驚全蠍一個琥珀辰砂各少許麥冬湯調下一字獨活湯治胎驚發散風邪羌活獨活各二錢檳榔天麻麻黃去節甘草各一錢上銼散每服一錢白朮煎內加天南星末蜜調貼囟門上凡小兒生下大便三五日不通者此名鎖肚胎中受熱熱毒壅盛結於肛門閉而不通無復滋潤急令婦人以溫水漱口吸咂兒前後心並臍下手足共七處凡四五次再用輕粉五分蜜少許溫水化開時時少許服之以通為度如更不通即是肛門內合或以金簪透而通之須刺入二寸以香油和蜜納入孔中糞出為快也若肚脹不乳呻吟聲至於七日難可望生矣凡小兒生即不吮乳此由拭口不淨穢物入腹致令腹滿氣短不能吮乳或有嘔吐乳不得下或胎中受寒令兒腹痛不乳此則多啼以木香散治之木香甘草茯苓乾薑木瓜丁香陳皮各等分共為細末每用一字水煎綿蘸滴與食之臍風者由斷臍之後被水濕風冷之氣所乘流入心脾令腹脹臍腫四肢強直日夜多啼不能吮乳甚則發為風搐若臍邊青腫撮口不開者是為內搐不治爪甲黑者死撮口者由胎氣挾熱兼風邪入臍流入心脾二經故令舌強唇青口撮喘急啼聲不出不乳若口出白沫四肢冷者不治最為急候一臘之內尤甚噤風者眼閉口噤啼聲漸少吮乳不得口吐白沫大小便皆不通亦由胎中受熱熱毒流入心脾故形於喉舌間也以上三症其名雖異受病則一初生七日之內得此症者多死若不急救坐以待斃良可憫焉但見小兒噴嚏多啼身熱不乳急看兒上齶有小泡子如粟米大或以指甲或以挖耳輕輕刮去以綿絹纏指蘸溫水拭淨其血勿令下咽即便安妥不必服藥誠良方也凡小兒牙關緊急已成撮口驚搐者先用撮風散以開其關次用控痰散以吐其痰然後用益脾散和胃保命丹祛驚即愈若手足攣拳口噤不開者不治撮風散金腳蜈蚣炙令毒不明全蠍炒去毒五個直殭蠶炒去嘴麝香少許共為末每用一字以豬乳和之滴入口中即開控痰散蠍尾銅青各五分硃砂一錢膩粉一錢麝香少許共為末每服一字臘茶清化下吐出風痰益脾散白茯苓草果煨木香甘草陳皮厚朴炙蘇子各等分為細末每服五分薑棗煎湯細細服之亦有熱在胸膛伸縮無時厄厄作聲弩脹其氣以致臍突浮腫此非斷臍使之然也但散其血愈加減龍膽湯主之膽草前胡黃芩防風麥冬桔梗赤芍茯苓甘草大黃煨減半水煎服得下便止亦有肚脹青筋吊腸卵疝內氣引痛而撮口者皆腸胃鬱結不通致之治法貴乎疏利紫霜丸量而與之一粒金丹尤妙紫霜丸代赭石醋淬七次赤石脂各一兩杏仁去皮尖五十粒巴豆去殼心三十粒先將杏仁巴豆研如泥後入二石和勻浸蒸餅丸如粟米大百日者三丸周歲者五丸看兒肥怯加減微利為度凡臍中出汗不幹者用龍骨五分黃柏一錢枯礬二分半為末敷之西江月小兒初生病症許多名狀難同胎驚撮口與臍風寒熱肥瘦黃腫嘔吐昏昏不乳臍間血水溶溶未曾滿月病多凶好似風中燭弄最是臍風可畏三朝八日為殃初時噴嚏似風傷啼哭時時噪嚷急看口中上齶刮除白泡中央展揩惡血細端詳莫使下咽為上若是不知此法致令泡落兒吞忽然腹脹滿膨膨臍腫青筋雜亂撮口昏昏不乳目瞪又緊牙關啼聲不出命歸天勸取衣棺早辦胎黃狀如金色身熱大便難通小便黃赤色朦朧少乳時時舌弄此症傳來無毒脾胃濕熱相攻涼驚涼血解重重保養胎元𠔥用外有胎肥胎瘦此為稟賦虛盈父精母血必多虧兒子不充元氣此個甚難調理愚夫不曉支持一朝有病致傾危卻把命來抵對生下時時吐奶不思乳食昏沉此由穢物下咽門拭洗未能潔淨會厭中間阻隔太倉上口留凝豁痰順氣藥通神炮製生薑作引生下忽然腹脹臍中血水淋漓斷臍將息失調宜客水邪風侵入外用灰礬黏貼速令乾較為奇若還撮口哭聲稀縱有靈丹莫治小兒生下數日睡中啼哭多驚此因母氣失和平常因七情為病以致胎胞氣逆痰涎流入脾心治須順氣更清神鎮墜痰涎始定胎熱遍身如火發斑丹毒風瘡神昏目痛又驚彰大小便難哭嚷此是母貪煎炒溫經暖藥乖方急須解毒令清涼甘草黃連為上胎寒生來吐泄大便滑溜多清腹中疼痛哭聲頻面色青黃不定平日母喜生冷寒邪傳入胞經治宜丸散用甘溫可保嬰兒性命要識小兒治法方為得業專門半周一歲病何因胎毒單單見症自後飲食漸減肥甘之變須明此時脾胃病多尋消食養脾法定胎病要行涼解無如甘草黃連若加脾弱病相參參朮陳皮有驗巴豆牽牛丁桂砒硫白汞青鉛俱傷正氣損真元誤了孩兒命短變蒸門變蒸者此小兒正病也蓋變者異也每變畢性情即異於前何者長生臟腑之意也蒸者蒸蒸然熱也萬物生於春而長於夏者以陽主生長將於人亦然故變蒸足始及成人氣血充實骨肉堅牢也小兒此症譬如蠶之有眠龍之脫骨虎之轉爪而變化同也故每三十二日有變蒸至五百七十六日大小變蒸足矣輕則發熱微汗其狀似驚重則壯熱脈亂而數或汗或煩啼哭燥渴輕者五日解其候與傷寒相似亦有變蒸之餘感寒邪者但變蒸則耳冷上唇發泡如濁珠若寒邪傳之則寒熱交爭而腹痛啼哭之聲旦夜不絶治此之法輕者不須服藥重者以平和飲子微表之熱甚便結以紫霜丸微利之若吐泄不乳多啼者調氣散治之平和飲子人參五分白茯苓去皮一錢甘草五分升麻煨五分稟受弱者加白朮一錢肥實者不用水煎服調氣散木香香附厚朴炙人參陳皮藿香炙草薑棗水煎凡小兒初生有用黃連甘草以下胎糞者若兒壯實者稟胎足固無所損若稟胎怯弱者受此寒涼之劑不生異症者鮮矣如有里症鬱結壅閉不通者欲下胎毒只用淡豆豉濃煎湯與之五七口其毒自下又能助養脾胃真奇方也凡小兒當變蒸之時不熱不驚別生他症是為暗變此受胎氣壯實故也凡小兒初生多有灸百會者取其可以截風也殊不知地有南北人有勇怯北人用灸固宜南人用之無益而有害也凡小兒初生下有身破裂者必死陰囊白者必死陰不起者必死無糞門者必死股間無肉者必死哭如鴨聲者必死周歲之間顱骨開解齒未生手足攣縮膝如鶴節身體瘦弱長大不能行立者此皆胎氣不足者也多夭若筋實則多力骨實則行早血實則形瘦多發肉實則少病精實則伶俐多語笑不怕寒暑氣實則少發而體肥此皆受稟胎氣之有餘也多壽西江月小兒變蒸何以三十二日為期精神改變異常時發熱蒸蒸昏睡或遇風寒外感或𠔥乳食傷脾留連苦楚莫差池好把湯丸調治大抵六十四日初生腎與膀胱再生心火與小腸肝膽第三長養肺與大腸居四脾胃五次消詳三焦胞絡不同鄉只為有名無狀小兒變生智慧自然發熱如蒸昏昏不乳缺醒醒恰似蠶眠相應醫者不須妄治父母何必憂驚三日之後自和平只怕別生形症若遇風寒外感惺惺散子堪行內傷乳食不安寧保和養脾𠔥進咳嗽參蘇飲子吐泄理中最靈驚來搐掣用泄青導赤亦宜選進驚風門驚自是驚風自是風要分別明白不可混治凡小兒因聞非常之聲見異類之物或為爭鬥推跌或大小禽獸之類致驚其神氣結於心而痰生焉痰壅氣逆遂成搐搦口眼歪斜口吐涎沫一時即醒如常無事或一日一發或間日再發或三五日一發或半年一發一年一發若不急治變成癇疾而為終身之痼病也治法當先利痰順氣後用清心安神風者或因外感風寒或內傷飲食以致熱生痰痰壅發搐口眼歪斜手足牽動氣喘涎潮口吐涎沫發過略醒潮熱不退須臾復發治法當先泄火開痰後用安神清熱驚風有二有急有慢急驚風為實為熱當涼驚泄火慢驚風為虛為寒當用溫補不可一例混治以致殺人急驚風小兒元氣素實或因恐怖或因風或因飲食而發要審明白詳察症候而施治法如曾因恐怖而成驚者其症發過即如常若無他症先以利痰丸順氣開痰後用安神丸調之如曾因風寒而成者其症發過略醒須臾復發輕者只用導赤散吞下瀉青丸以清心肝之火後以抱龍丸治痰保命丹除風緩緩調之如曾因傷飲食而成者其症發過略醒醒多啼哭須臾復發不思乳食先用陳皮麥芽湯吞下五色丸推去食積則痰自降後用辰砂五苓散治之凡治急驚風除飲食一症外不可遽用下藥必先問其大小便何如若小便清大便通利其邪在表只用導赤散加防風或瀉青丸去大黃加全蠍作湯服之去表中之寒邪其風自退後以辰砂五苓散調之不可犯麝香恐引邪入里若小便赤澀大便祕結此邪在裡可用五色丸下之後用抱龍丸保命丹調之凡急驚發時牙關緊閉不醒者急用艾炷灸兩手大指頭少商穴合而灸之在甲旁即醒而後施治法凡急驚風痰氣喘急者用定喘湯加竹瀝治之痰涎湧塞不開者可用吐法凡病退後潮熱不退者此脾虛熱也四君子湯加炒乾姜以治之若小便赤大便硬兩腮紅足脛熱者此餘邪未盡不可作虛看用涼驚丸薄荷燈心煎湯吞下調之凡病退後睡眠不醒者此心脾二經之邪熱未盡去也安神丸治之凡小兒但有潮熱觀其兩頰若赤目上視者必作驚風也當先以導赤散加燈心薄荷以去其熱次用抱龍丸以安其神則風自不作矣利痰丸南星牛膽者二錢枳殼麩炒二錢陳皮去白一錢大黃二錢牽牛頭末二錢共為末皂角煮水為丸燈心湯吞下安神丸黃連去毛二錢石菖蒲二錢遠志去心二錢歸身二錢麥冬去心二錢茯苓二錢山梔子二錢共為末煉蜜為丸導赤散生地木通甘草竹葉七皮水煎服五色丸黃芩二錢大黃二錢黃連二錢共為末分作五份滴水為丸一份青黛為衣名青丸子一份硃砂為衣名紅丸子一分輕粉為衣名白丸子一份皂角燒灰存性研末為衣名黑丸子一份雄黃為衣名黃丸子瀉青丸歸身川芎大黃煨羌活防風梔子仁膽草各等分為末煉蜜為丸如梧桐子大竹葉湯下此瀉肝火之藥也如發熱去大黃加全蠍殭蠶炒竹葉引水煎服辰砂五苓散豬苓澤瀉赤茯苓白朮官桂燈心引水煎調辰砂末服之定喘湯陳皮去白南星制梔子仁軟石膏杏仁泥薄荷葉赤茯苓上銼水煎入竹瀝服之吐法用土牛膝根取自然汁灌入口中其涎自吐灸法先以兩手大指相合於甲側縫中處燒三壯又以兩手中指相合於甲側縫中心燒一二壯即醒者可治不知痛者不治祖傳治驚風先以雄黃解毒丸利去痰熱後用涼驚丸退火再用保命丹安神丸調之發急驚風之時手撮目閉口張囟陷魚口氣促急吐沫噴藥昏睡不語不啼口禁絶不飲食遺尿失屎面赤如朱此皆不治之症凡慢驚風小兒胎稟素弱又多疾病或大吐大瀉或久瘧痢誤服吐下之藥皆致精神虛耗漸成搐搦十無一全如元神虛弱又逢恐怖而成慢驚者其症發過即如常但多啼哭睡中不寧不可妄用利痰之藥先以青州白丸子加青礞石以去其痰次服安神丸以四君子湯送下如因吐瀉大病之後手足逆冷昏睡目睛微露而無搐掣者此欲成慢驚症也急溫補之四君子湯加熟附子一片愈後以集聖丸調之凡吐泄大病之後已成慢驚風者其症口目牽引手足搐掣以醒脾散驅風醒脾風退以參苓白朮散為丸服之凡慢驚風痰氣壅塞者不可妄用通利之藥只以青州白丸子加青礞石治之凡慢驚風不醒不退者灸百會三里男左女右乳下凡慢驚風已退或有餘熱不喜飲食先服四君子湯一二劑後以集聖丸調之青州白丸子半夏炮川烏去皮尖各五錢南星二錢白附子五分共為末以絹袋盛之用水擺盡為度放磁器內日曬夜露一日一換其水換水必攪數轉候如玉片再研細又用青礞石一錢另研細以焰硝五分同石末入銅鍋內煅通紅硝盡為度令冷入上藥和勻以糯米粉打糊為丸以薄荷湯入蜜調送下其痰自墜調元湯黃耆一錢人參五分甘草炙二分半白芍五分水煎服內經云熱淫於內以甘瀉之以酸收之此之謂也醒脾散人參全蠍白附子天麻甘草炙白茯苓木香白朮石菖蒲蓮肉水一鍾薑棗引煎服有熱去木香凡治驚風不可妄用辛香寒涼之藥蓋辛香能竄元氣寒涼反傷脾胃也凡小兒夜啼哭目睛上視日間略定者此內瘹也蓋因受寒氣腹中作痛以至痛極目定以燈心燒灰調滾水化下理中丸痛止病退如小兒日夜啼哭目睹物不轉身後仰者此外釣也蓋食積作痛其身強直而目亦定以灶心土泡滾水送下丁香脾積丸病退痛止如小兒忽然氣急涎響口眼如常手足不搐身無熱者此乍感風寒肺經受邪也用芎蠍散一服即退如小兒腹脹喘滿胸膈氣急兩肋扇動陷下作坑兩鼻竅張悶亂咳嗽作渴聲嗄涎痰壅塞大小便閉此馬脾風也若不急救或不識症死在旦夕宜先用牛黃奪命散下之後用白虎湯平之如小兒兩手輪指目略直視此白虎證也但身不熱手足不掣宜向本年白虎方取土泡湯吞蘇合香丸如小兒口吐黃白沫面色變易喘急腹痛反側掣搐其狀似驚但眼不上竄此由精神虛弱外感客氣卒暴觸忤名客忤耳先視其口中上齶左右有小腫泡急摘破之更以蘇合香丸薑湯化下外以降香皂角二味燒熏次用淡豆豉三合水浸濕搗爛為丸如雞子大摩兒囟上及兩足心各五六遍次摩臍心良久拍開有毛即擲之如小兒久咳腹脹作喘胸高氣逆目睛上視手足牽引此名龜胸熱證也但身無熱以葶藶丸治之方見咳嗽門以上之證俱與驚相似不可一例施治誤者恐傷其命芎蠍散川芎蓽茇各一錢蠍梢二分細辛一分半夏酒浸一宿湯泡七次焙乾一分共為末熱湯調服或薄荷湯化下亦可牛黃奪命散白牽牛黑醜各半生半熟取頭五分大黃枳殼各一錢共為末冷漿水調下涎多者加蜜少許如小兒痘疹驚搐者只用導赤散調辰砂末一服不可妄用涼驚抱龍保命等藥西江月小兒驚風證候須分急慢根由急因實熱泄中求慢是虛寒溫補急為風寒食積慢是久病綢繆如斯辨認不差謬才顯神功妙手急驚卒然大熱因而熱則生風痰涎哽塞角張弓口眼歪邪沉重先使嚏驚妙散後用導赤疏通合灸少商與中衝瀉青涼驚選用若遇風寒外感先鬚髮汗為宜瀉青丸子作湯醫加上蠍蠶二味果是內傷飲食又當解利相隨三黃五色任施為積去熱除驚止慢驚先因久病精神漸減脾虛懨懨沉困氣長吁口眼張開不乳搐搦時時齊發四肢逆冷何如理中附子急驅除不瘥艾灸左乳即期門穴也小兒乳下一指要認驚風死症面如紅粉塗搽口張涎出緊關牙目直氣粗聲啞喉內響似拽鋸毛端汗如珠下目瞪眼小不須誇大叫悶亂尤怕搐掣乍作乍止痰氣無了無休昏昏鼾睡喚難蘇乳食不知吞吐屎尿遺時少覺四肢僵直難收啼聲不出汗如油縱有靈丹難救小兒驚風咳嗽人人當作風哮大黃白黑二牽牛人參分兩勻用四味俱研為末蜜水調和稀稠灌將一字下咽喉免得胡針亂灸兩指伸縮名為搐十指開合搦之形掣則連身常跳起顫而四體動搖鈴身仰向後為反症手如挽弓引狀成怒目覷高是攛樣睛露不活是斯真嘔吐門聲物俱有曰嘔無聲有物曰吐有聲無物曰乾嘔其症有三有寒有熱有食積寒吐者吐時少而出物多此胃受寒也以理中丸治之或用胃苓丸以煨薑湯送下寒吐食不化惡食熱吐者吐時多而出物少此胃有熱也以二陳湯加黃連煨姜治之熱吐食化不惡食食積吐者要分三焦明白俱惡食如食即吐者此積在上焦胃口也宜用淡鹽湯吞一小鐘後以鵝翎毛掃喉中令其吐盡舊積後以二陳湯加乾薑煨神麯炒麥芽炒砂仁治之如食入之時而吐者此積在中焦下口過小腸上口處也先以丁香脾積丸通去舊積後以二陳湯加消導藥治之如早食晚吐晚食早吐者此積在下焦小腸下口過大腸上口處也先以丁香脾積丸下之後以二陳湯加消導藥治之消導藥神麯麥芽炒砂仁香附子之類如嘔吐久而諸藥不納者此胃口壯火關格之病用理中湯以童便豬膽汁同炒煎服即安如嘔吐蛔蟲者以理中丸加烏梅一個附子一小片黃柏川椒一服即愈凡嘔吐後瘦弱者只以集聖丸調之理中湯此藥性熱所以治寒人參甘草炙乾薑炒白朮水一鍾煎服若為丸煉蜜臨時為丸滾水送下如諸吐不納藥者此陰盛拒陽也必加童便豬膽汁者取童便味酸鹹性寒膽汁味苦性寒以和理中湯服則陰體漸消陽性乃發故內經曰伏其所主先其所因之謂也二陳湯此藥性平寒熱通用陳皮半夏薑汁泡七次白茯苓甘草水一鍾生薑三片引嘔吐加白朮煨乾姜此二味嘔吐必用之藥也挾熱而吐者加煨乾薑炒黃連凡傷食加神麯炒麥芽砂仁香附子山楂此五味消導必用之藥祖傳治嘔吐只用胃苓丸煨乾薑湯吞治之不問寒熱凡吐不止服藥無效加煩悶者不治吐不止目上竄頭後仰者不治西江月嘔吐病原不一治者要辨根由嘔則聲物一時有有物無聲曰吐更有有聲無物此名噦而乾嘔又當辨症藥分投有甚難為措手冷吐乳食不化腹脹喘急無時面白眼慢氣多籲吐有夾食清水此因風寒入胃或食生冷傷虧抑傷宿乳胃中虛不納乳食吐出熱吐唇紅面赤乳食入而難消吐物黃色遍身燒大熱渴多煩躁此因暑氣在胃或食熱物煎熬胃氣因熱不和調氣逆遂成吐了積吐如何分曉眼胞浮面微黃足冷肚熱異尋常晝輕夜重魔瘴宿冷滯在脾胃故吐黃酸水漿或吐酸餿氣難當此傷宿食形狀小兒傷乳吐者形症更要消詳乳才哺後吐浪蕩或少停而吐止此因乳食無度脾氣弱不能當速將空乳令兒嘗乳節吐止為上吐症既分明白治法猶貴精微冷吐理中湯最宜熱吐五苓去桂積吐九轉靈應下後枳朮調之傷乳而吐藥方奇三稜散子為最嘔吐乳食不納任是湯藥難嘗此謂陰盛格孤陽時醫都無主張參朮煨姜熟附烏梅童便尤良豬膽同入慢消詳此法應如影響吐嘔諸藥不納我有絶勝奇方定吐飲子妙非常半夏官桂二樣生薑獨宜多取甘草少用為良依方製造水煎嘗仍用生薑為上一等蛔蟲吐出此為蛔多厥陰烏梅丸子效如神一服蛔安吐定又有咳而吐者化痰順氣須明如常嘔吐只胃苓湯用生薑作引嘔吐不止之症分明說與醫人如服正藥俱無靈更加煩躁亂悶嘔吐只是不止目睛上竄須危頭往上仰魄如飛只好安排後事再附噁心一症有痰有熱有虛三症生薑通用之藥宜隨症區處若是胃中有熱二陳加上芩連薑汁炒過共同煎各用一錢最驗泄瀉門泄瀉皆屬於濕其症有五治法分利升提為主如泄瀉清白或不思食食不化腹痛四肢冷面㿠白作渴者此寒濕也其症多得於冬以五苓散作引吞化理中丸即止如寒甚不止者理中湯加附子一片即效如泄瀉注成黃水者或渴或不渴此風濕也其症多得於春五苓散加防風羌活蒼朮治之如泄瀉清水腹中無痛者此純濕也以胃苓湯治之如泄瀉腸滑不止者此濕傷元氣下陷也宜升提之四君子湯加升麻防風烏梅治之或用四君子湯吞下七味肉豆蔻丸如泄瀉酸臭腹痛面黃帶熱不喜飲食者此食積也先以丁香脾積丸推去其積後以集聖丸調之如泄瀉日久目無神氣口略張四肢冷好睡者以四君子湯調之多服有效甚者加熟附子一片煨姜服之如泄瀉日久身熱不退只以調元湯治之此虛熱也不可妄用寒涼之藥甚者加乾薑即效凡久泄後人事黃弱者以集聖丸調之五苓散入膀胱腎經豬苓去皮澤瀉白朮赤茯苓官桂此分利陰陽之藥也水一鍾煎服理中丸人參白朮甘草炙乾薑加砂仁藿香烏梅附子豬苓澤瀉玉露散此藥性寒所以治熱寒水石滑石各一兩甘草五錢共為末每服一錢冷水調下或用此藥煎湯吞理中丸胃苓湯蒼朮厚朴豬苓澤瀉白朮白茯苓甘草陳皮官桂四君子湯此藥性溫可以補元氣之不足人參白朮白茯苓甘草水一鍾姜三片棗二枚溫服肉豆蔻丸此藥性溫而澀所以止滑也肉豆蔻麵煨五錢赤石脂七錢五分廣木香二錢砂仁二錢枯礬七分半白龍骨五錢訶子肉五錢共為末水糊為丸陳米湯送下白朮散此治渴之聖藥也人參白朮白茯苓木香藿香葉甘草各一兩乾葛二錢共為粗末每用一二錢姜三片引水煎服袖珍方非乾葛乃乾薑也調元湯此治虛熱之聖藥也黃耆人參甘草如熱不退加乾薑即效如身熱手足寒者加熟附一片煎服祖傳治泄瀉不問寒熱只用胃苓丸兼一粒金丹以車前草同炒米煎湯服之凡久泄不止精神美好面赤唇紅者不治凡久泄不止作渴不休者不治凡久泄不止脈沉細遍身皮冷不思乳食泄滑不止者不治凡久泄不止又成驚搐者不治凡久泄不止變成赤白痢疾者不治凡久泄不止大肉消瘦者不治凡久泄不止大孔如竹筒不收閉者不治凡泄瀉不問輕重只要飲食如常不生他症者不難於治而易愈西江月泄瀉祕傳治法等閒不語時人如今傳授與子孫勝似良田萬頃初次且行淡滲溫中以次施行三升四塞救兒嬰此方古今永定泄瀉緣何發作只因水穀無分所以淡滲法先行小便長而泄定滑石車前赤茯人參白朮豬苓甘草澤瀉與砂仁薑棗煎來作引淡滲行而又泄須防穀氣中虛溫中丸散不須拘斷要一時泄住白朮人參砂藿炙姜炙草依書烏梅熟附澤瀉豬引用生薑作主溫中若還不效中氣下陷須提人參白朮與黃耆甘草乾姜炙取澤瀉豬苓赤茯升麻熟附烏梅柴胡白芍與當歸引用薑棗休棄以此升提未止只因腸滑難收塞用通用更何憂擊其惰歸可救參朮炙姜炙草烏梅粟殼相扶升麻訶子芍歸求薑棗同煎溫服法盡泄還不止其間吉少凶多假饒父母不奈何要你醫時休錯參朮附陳薑棗砂仁豆蔻粟訶乾蟾蘆薈木香和赤石醋丸服可泄瀉時常作渴白朮散子如仙人參白朮木香兼乾葛藿香葉片甘草茯苓七味烏梅加上同煎臨時再用伏龍肝此法千金不換泄瀉如常治法不須別用心機只將黑藥胃苓醫三服自然停息如此不能取效依前四法支持吾將心法教人知才顯明醫三世五六月間泄瀉其中寒少熱多理中丸子救沉疴玉露散子真可不效四苓作引同吞理中調和自然泄止莫蹉跎活得人多念我夏月人多泄瀉腹疼煩熱相攻豬苓澤瀉茯苓同甘草乾姜炙用白朮黃連滑石人參砂藿溫中升麻提氣妙無窮更把烏梅煎送泄瀉症雖各別大要總因濕成風寒水濕中人身乳食過傷為病此由中氣不足脾胃積滯惟深以致氣脈不調勻故成泄瀉之症人皆知有泄瀉當分泄瀉原根冷則滑泄故無聲熱則腸結為病故致裡急後重如水注下有聲此名瀉症熱緣因下麵條陳病症細詳冷泄病症腹中卻似雷鳴注下清白水之形面白肚疼等症甚者四肢厥逆此由兒弱溺寒侵寒氣在腹刺攻人故令兒患此症熱泄色多黃赤小便不利心煩口燥作渴定咽乾食乳必粗可驗此由腸胃挾熱冷風乘入其間熱氣相傳不安然所以兒有此患冷熱不均泄瀉瀉色赤白不常或水或谷病為殃小兒如何抵當此由先冷後熱先熱腹被冷傷腸胃宿虛虧中臟冷熱交攻勻當更有傷食而泄腹痛乳食不思面黃寒熱異常時糞多酸臭氣味此由乳食過度以致脾胃傷虧遂成泄瀉病孩提小兒多有此疾又有一般暑泄多於暑熱之時亦宜寒熱症中推庶好斟酌用劑若或瀉瀼赤白腹大青筋發稀或吃泥土出蛔時此為疳泄之疾又見泄多青色亦或發熱有時睡臥不安忽驚悸乃是驚泄之勢此是脾受肝克速宜及早醫之若變脾風瘈瘲時就是神仙費力泄瀉注成黃水或渴不渴殊途此在風溼症中求多病春天時候如或瀉下清水腹中不作痛楚此是純濕病之由症傳陰雨之後泄瀉腸滑不止濕傷元氣陷虛藥宜升舉救兒軀才得醫理妙處如或泄瀉日久身熱仍舊不除此為日久氣多虛調元湯劑宜服丹溪治泄之法瀉水腹無痛疼此症因受濕分明四苓二術當增飲食入胃不住宿穀不化猶存此則氣虛病之根參朮升麻芍並腹內痛甚而瀉瀉後痛減覺輕此在食積症中尋神麯大黃推滲一痛一泄成障泄火更見腸鳴火症分明用四苓加上芩通尤勝大端泄瀉諸症治法條貫分明醫人最要細詳論尤貴依方對症調治只依前法澀藥切莫先行若然胡亂敗章程反變痢膿重症泄瀉不知症候許久不止堪憂精神美好渴無休面赤唇紅消瘦脈理若見沉細滑泄不乳煩愁變痢赤白或驚搐大孔如筒不救辨症歌便黃因內熱紅赤黑同看緑白青皆冷疳肥食臭酸久泄四肢癱才驚睡不安熱疳毛作穗涎嗽定傷寒肝冷傳脾臭緑青焦黃脾土熱之形肺腸寒色膿黏白赤熱因心腎熱成身熱發厥歌久泄多虛熱氣虛多發厥血虛須作熱氣血若俱虛身熱手足厥吐瀉門吐瀉名曰霍亂其症有三有寒有熱有食積凡上吐下瀉兩腮紅赤遍身熱口作渴吐瀉時多而出物少者此屬於熱用五苓散煨乾姜治之或用煨薑湯澄冷調服益元散神效凡上吐下瀉面㿠白足冷腹痛多啼哭不作渴吐瀉時少而出物多者此屬於寒用理中湯治之甚者加附子烏梅效此上二症皆不阻乳食凡吐瀉出物酸臭面黃不喜飲食腹常作痛者此食積也以丁香脾積丸推去其積後以集聖丸調之凡吐瀉久身瘦作熱者只用集聖丸治之祖傳治吐瀉不問寒熱虛實只用胃苓丸煨薑湯送下即安益元散又名六一散又名天水散滑石六兩甘草一兩為細末或煎服或冷水調服凡吐瀉不止作渴不休者不治加驚搐者不治口舌生瘡手足冷身熱此陰降陽升脾氣中絶不治西江月大凡男女吐瀉陰陽順逆當明男逢瀉甚下無陰女子吐多不應出物多而數少此為寒盛相侵如逢物少數頻頻火盛細加體認吐瀉若是同見此名霍亂陰陽只用一劑理中湯上吐下瀉了當服此若還不效再加熟附煨姜烏梅作引是良方莫與俗人誇獎吐瀉時時作渴諸般湯藥無靈飲水飲湯腹膨膨束手坐觀死症急用伏龍飲子時時與吃調停須臾吐止火邪寧才與理中對症吐瀉分為三症食積寒熱當知面黃糞臭惡乳食此症方為食積若是身熱作渴宜為熱症祛除面白身寒腹痛時正是虛寒之疾食積宜行轉取靈應去積為宜如逢熱症又何如益元五苓為主寒症理中可用甚加附子烏梅寒熱總用胃苓奇吞用乾薑煎水痢疾門痢疾不問赤白皆屬濕熱或以赤為熱白為寒者非也亦有食積而成者其治法有補有泄赤白濕熱皆有但熱症腹痛濕症腹不痛凡痢有赤者此濕熱傷在血分從小腸中來也以四物湯加黃連黃芩黃柏治之凡痢有白者此濕熱在氣分從大腸中來也以四君子湯加黃連蒼朮治之凡赤白相雜者此血氣俱傷以八物湯加黃連黃芩黃柏蒼朮滑石治之以上三症有後重者俱加檳榔枳實凡治痢疾不問赤白但初起之時裡急後重腹中脹痛者先用三黃丸大承氣湯下之後用香連丸調之凡痢赤白日久人事虛弱原未經下者若下之則人事虛而不可損其不足若不下則積不去而難愈只用保和丸連服數次俟腹痛止為度後以香連丸調之凡治痢不可妄用巴豆牽牛只用三黃丸穩當凡痢有鮮血者用清血丸以車前草陳米煎湯送下凡痢有白涎久不止者用固腸丸以陳米飲送下凡暑月痢純血者以益元散炒過滑石加紅曲為丸陳米飲送下凡赤白痢脫肛者此氣下陷也宜升提之和中丸以升麻湯吞之凡赤白痢嘔吐不食者此名噤口痢用木香則失之溫用山藥則失之閉只以參苓白朮散加石菖蒲末陳米飲調下胸次一開自然思食凡痢止後身熱不退或人事瘦弱者只用集聖丸調之芍藥湯行血則便膿自愈和氣則後重自除白芍二錢歸尾黃連黃芩各一錢大黃七分甘草檳榔木香桂心各五分上細切作一服水碗半煎一碗空心服如病初後重急迫者倍加大黃加芒硝一錢若痞滿氣不宣通者加枳實一錢四物湯當歸川芎白芍熟地黃加黃連黃芩黃柏水煎溫服四君子湯見泄瀉門加黃連黃芩蒼朮水煎服八物湯見胎毒門加黃連黃芩黃柏蒼朮滑石枳殼檳榔水煎空心溫服三黃丸黃連黃芩大黃各等分為末神麯糊丸木香檳榔湯送下大承氣湯此通腸去積之藥枳殼厚朴大黃芒硝甘草加檳榔水煎服保和丸凡食積脾胃虛者用此藥山楂肉一兩神麯炒半夏白茯苓陳皮萊蔔子連翹各五錢麥芽炒一兩甘草三錢共為末蒸餅和丸如粟米大米飲送下清血丸槐米炒荊芥穗枳殼麩炒側柏葉醋炒各等分為末醋糊丸陳米湯送下固腸丸即二根丸紅椿樹根白皮白椿樹根白皮各等分為末米糊丸陳米飲送下清六丸即益元散加紅曲是也血痢者此方主之滑石炒一兩甘草二錢半紅曲去殼炒五錢為末米糊丸陳米湯送下和中丸黃連炒陳皮各五錢半澤瀉車前子白茯苓山藥白朮木香石蓮肉肉豆蔻麵包火煨乾薑炒人參各二錢共為末醋糊丸陳米飲送下如脫肛者升麻湯送下參苓白朮散此藥性平補助脾胃之藥也人參白朮白茯苓山藥白扁豆薑汁炒甘草桔梗薏苡仁石蓮肉各一兩加石菖蒲一兩共為末陳米湯化服祖傳治痢不問赤白只用保和丸香連丸調之凡痢久大熱大渴不退者不治凡痢日久六脈洪數面赤身熱者不治凡痢日久作渴不止者不治凡痢日久嘔吐不食服藥無效者不治凡痢日久不止下紫血成塊者不治凡痢日久下黑水如屋漏塵水者不治凡痢日久大肉瘦削折者不治凡痢久脫肛出寸余者不治凡痢久轉作驚搐者不治凡痢變作泄瀉飲食如常者易治西江月痢疾古名滯下食積濕熱相參腸鳴腹痛不能安裡急後重無遍赤乃小腸火盛白自大腸邪傳愚醫以白作寒看辛熱亂行丸散治痢無過二法河間祕訣流傳行氣和血術中仙管取十全無變氣行後重自止血和下痢自安寒涼淡滲禁辛甘不怕年深日遠凡痢先行通藥黃連枳殼檳榔多加酒蒸過大黃或用三黃推蕩若是虛人忌此且從消導推詳保和丸子是仙方只要認病停當下後痛除裡急再將赤白消詳赤痢無過剪紅方白痢固腸穩當赤白相兼不愈香連丸子高強術精鄉郡把名揚奪取錦纏頭上若遇時行痢疾排門一樣無差頭疼身痛慢吁嗟疫癘氣行須怕先用人參敗毒次將承氣推詳然後察脈看減加虛實分明調他痢久前法不止氣陷腸滑無停急將涼藥與提升固澀兼行甚穩參朮升麻歸芍烏梅粟殼連芩乾薑訶子赤茯苓粳米陳皮作引記得痢症藥品解毒梔子芩連大黃芒硝可推陳木香青皮痛定檳榔枳殼後重升麻柴胡提升固腸粟殼訶梅靈澤瀉豬苓水順痢疾不治數症脈若洪大須防禁口不食吐水漿大熱煩渴腹脹大孔不收魄戶糞如塵黑瓜瓤面紅唇赤陷眉眶氣急悶亂死樣小兒肛頭脫出此由泄痢深沉氣虛下陷不能升冷熱不和相併裡急後重難便用力太過傷神以致肛出冷寒乘不得收返而進要識脫肛症治養血和氣為宜川芎白芷與當歸白芍人參赤石槐子山藥蓮肉龍骨五倍相隨細研五倍丸子兒仍用米湯吞吃內服湯丸取效外用諸藥扶持梁上倒掛壁塵灰鱉頭燒灰研細鼠糞共末艾捻入桶用火燃之人坐其上令熏宜頃刻肛頭收入前法若還不效田螺取搗為泥朴硝大黃共和之捶膏敷上即愈不效再用搽藥熊膽冰片堪題鵝膽調搽病即除此法醫人牢記導氣芩連共木香大黃歸芍殼檳榔痢下膿血時無度管取一服即安康治脫肛浴法用陳艾煎水以陳壁土研細入艾水澄過渣以艾水溫浴之俟收入為度外用尉法尉法用麥面以好米醋和成薄餅敷在臍上將艾薄薄鋪於餅上燃之
