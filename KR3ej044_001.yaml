body:
  text: 卷之一活幼指南賦小兒方術號曰啞科口不能言脈無可施惟形色以為憑竭心思而施治故善養子者似豢龍以調護不善養子者如舐犢而愛惜愛之愈勤害之愈急乍頭溫而足冷忽多啼而不乳差之毫釐失之千里此小兒方術專門以補化工之不及腸胃脆薄兮飲食易傷筋骨柔弱兮風寒易襲父母何知看承太馳重綿厚襖反助陽以耗陰流啜放飯徒敗脾而損胃聞異聲見異物失於提防深其居簡其出過於周密未期而行立兮喜其長成無事而嘻笑兮謂之聰慧一旦病生雙親心戚不信醫而信巫罔求藥而求鬼乃人事之弗修謂天命之如此欲觀氣色先分部位左頰兮青龍屬肝右頰兮白虎屬肺天庭高而離陽心火地角低而坎陰腎水鼻在面中脾土通氣觀乎色之所現知乎病之所起又況脾應乎唇肺通乎鼻舌乃心苗目為肝液胃流注於雙頤腎開竅於兩耳爪則筋余而脾為之運發則血餘而腎為之主脾司手足腎連牙齒苟本臟之或衰即所屬之先憊能辨形色兮似梃撞鐘若昧朕兆兮如石投水凡觀乎外可知其內紅色現而熱蒸青色露而驚悸如煤之黑兮中惡之因似橘之黃兮脾虛之謂白乃疳癆紫為熱極青遮口角扁鵲難醫黑掩太陽盧醫莫治年壽赤光兮多生膿血山根青色兮頻見災危能察色以知由豈按圖而索驥朱雀貫於雙瞳兮火入水鄉青龍繞於四白兮肝乘脾位泄痢而帶黃者須防咳嗽而拖藍者可畏腹痛方殷常面青而唇撮驚風欲發先頰赤而目瞪火光焰焰兮外感風寒金氣浮浮兮中藏癖積乍黃乍白兮疳熱連綿又青又赤兮風邪緊急察之既精治之得理鴉聲魚口枉費心機肉折皮乾空勞氣力氣色改移形容變易氣乏則囟門成坑血衰則頭毛作穗眼生哆淚兮肝風澀目口流涎沫兮脾冷滯頤面目虛浮定膨脹而氣喘眉毛顰蹙則肚痛以多啼蛔蛔兮脾胃漸敗𧈟瘡兮肛臟先虧苟瞑眩而弗瘳縱神仙亦何益手如數物兮驚風將發面如塗朱兮心火已熾坐臥愛冷兮煩熱之攻伸縮就暖兮風寒之畏肚大腳小脾欲困而成疳眼撑口張勢已危而必斃弄舌脾熱解顱腎憊重舌木舌蓋熱積於心脾便氣喘氣實火浮於肝肺齦宣息露必是牙疳哺露丁奚多緣食積唇乾作渴腸鳴自利夜啼分為四症變蒸周於一歲心熱欲言而不能脾虛無時而好睡病後失聲者腎怯咳嗽失聲者肺痿肚痛而清水流出者蟲腹痛而大便酸臭者積口頻撮而脾虛舌長伸而火熾龜胸是肺火脹於胸膈龜背乃腎風入於骨髓鼻乾黑燥兮火盛金衰肚大筋青兮木強土潰丹瘤瘡疥皆胎毒之流連吐瀉瘧痢乃積食之沾滯不能吮乳者熱在心脾嘗欲俯臥者火蒸腸胃喜視燈火煩熱在心愛吃泥土疳熱在脾腹痛寒侵口瘡熱積臍風忌於一臘火丹畏於周歲驚自熱來癇因痰致吐泄而精神耗者則危瘧痢而飲食減者必瘁驚本心生風由肝致搐分左右兮證有順逆藥分補瀉兮病有虛實急驚由於積熱之深涼泄便宜慢驚得於大病之後溫補為貴頭搖目竄而氣喘兮上工莫醫口禁鼻張而足冷兮神丹何濟閉目者無魂狂叫者多祟不知吞吐者必見閻羅反加悶亂者終歸蒿里既明症候次知調理胎毒用甘草黃連食積用白朮枳實急驚搐掣以導赤泄青慢驚瘈瘲以補中益氣集聖去疳備急治積抱龍丸化痰鎮驚胃苓丸補脾開胃夜啼須退熱清心哺熱必養血升提理中止泄香連止痢積熱不除涼驚丸大有神效沉寒難療養脾丸最為密祕痰火交攻兮三黃丸水穀不化兮一粒丹柴苓治瘧月蟾消痞潮熱金花咳嗽玉液瘡疥者胡麻丹瘤者涼膈吐瀉而渴者白朮可投煩熱而渴者益元為最斑疹兮消毒腹痛兮脾積衄血咳血者茅花重舌木舌者針刺口瘡不愈者洗心腹脹不食者平胃五拗治喘四苓利水退黃消腫胃苓加減以堪行破積安蟲集聖從容而可治大抵嬰兒易為虛實調理最取其平補瀉無過其劑尤忌巴牛勿多金石辛熱走氣以耗陰苦寒敗陽而損胃如逢食積解之不可或遲若遇虛羸補之尤為至急才少俄延便成勞斃慈幼警心賦醫門治例幼科最難腸胃脆而多傷乳食筋骨嫩而易感風寒易虛易實兮變如反掌或補或泄兮貴若轉丸咸多泄腎酸甚扶肝苦入心而寒涼損胃辛走肺而燥熱傷元欲求中正無過平甘或病須於瞑眩兮勿犯其毒且從治於權宜兮但取其能中病即已救本為先苟誤投於湯藥即便致於損殘此上工誓於活人而良醫驗於折肱嘗聞法無一定但占症候醫不三世勿服湯丸病者詳於擇術醫者務於救痊視疾若己見利勿貪先察運氣兮陽陰妙契次觀形色兮順逆瞭然春夏陽而苦寒可用在夫人之勇健秋冬陰而辛溫可參相其人之勞疳既溫反補以寒再宣七神離散五臟虧崩雖留心於方脈兮何補於世反致人於傷夭兮獲罪於天是故胎疾兮急於解毒食積兮利在消疳治分二法效可十全襁褓未寧但調其母匍匐不快當固其元悲夫腸胃中和豈堪藥石微乎氣血稚弱以漸發生治非得已病有卒然如護風燭心常凜凜若惜掌珠意惟拳拳醫可補乎司命應無忝於家傳且如病則熱起熱則驚生或治熱以熱或攻熱以寒熱在表而柴葛解肌可飲熱在裡而芩連消毒急煎積熱無如集聖虛熱妙以調元要在識夫脈色不可妄投湯丸貽終身之痼疾促嬰兒之壽年輕以變重功不補患徒委命於氣數不詳審乎簡編前車既覆後轍猶然魂魄遊於郊野哭聲達於淵泉識此之故是誰之愆嗟夫渡蟻駕橋放雀解樊況伊萬物之靈匪值一蟲之賤不知謹密遽爾輕泛推惻隱之良心如見入井考聖賢之遺訓如弗及泉居易慮險因蹶知便證隨百出治無一偏燮調造化保養真元善攻不如善守宜急不若宜緩種杏成林踵當年之董奉植橘名井見今日之蘇耽奈何瀉久變痢積久成疳瘧久生痞驚久成癇未至留連兮攻之宜速已見沉疴兮治之且緩腸胃祕塞急泄而已氣血虛羸兮急補而安外毒急攻毋令入腹表邪急解毋令再傳余則緩而調理常恐急而生變若藥下咽猶防其過治或中病勿張其能知者常慮一失死者不可復全與其悔於已誤孰若謹於未然欲求魚兔當守蹄筌苟多方而治病宜三復於斯言
