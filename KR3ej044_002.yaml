body:
  text: 卷之二小兒總治法面赤發熱服涼驚黃白髮熱用胃苓身熱便祕三黃下瘦弱發熱集聖靈變蒸發熱用拿法驚風導赤吞瀉青泄瀉胃苓用一粒熱泄玉露散同行寒泄理中丸可服泄渴白朮散生津痢疾保和同香連瘧疾養脾瘧自平咳嗽玉液降痰氣浮腫胃苓引燈心瘡疥胡麻丸最好養脾最是保孩嬰蛔蟲寸白用集聖臨時用藥細叮嚀小兒初生臍風初生三五日大便血嘗來黑色為胎糞鮮紅實可哀初生便嘔吐胞漿蓄胃中物盡吐自止不止便為凶小兒初生十日內少乳多啼常噴嚏急看喉中有珠泡手法刮去免憂慮不看撮臍風撮臍糞少通急用解毒散便下得從容便閉肚膨脹口緊咬唇青時時手足掣臍風枉用心腹脹不便名鎖肚口緊不乳是噤風目直叫哭盤腸吊天吊身仰似角弓初生芽兒有此病父母歡喜一場空小兒變蒸小兒初生多變蒸三十二日細推論如蠶之眠添智慧遍身發熱不惺惺變蒸休用藥三日自然安外感惺惺散傷食保和丸惺惺散內用人參甘桔川芎白茯苓細辛少許天花粉防風白朮九味行小兒胎疾胎熱甘草黃連湯胎寒去連加桂方胎黃甘草加茵陳胎驚辰砂一味良胎瘦胎肥浴體法胎怯五軟用地黃此是家傳真口訣兒孫記誦莫遺忘肝色多青心赤紅脾黃肺白腎黑同黃白疳虛黑中惡赤紅是熱青驚風小兒五臟部位五臟有外候不離正面間耳乃腎之竅兩眼原屬肝鼻孔肺為主脾唇心舌尖左頰屬木肝生風右頰屬金肺位同額為心火頦為腎準頭鼻土位居中五臟外症肝主風兮目直視悶亂叫哭不安寧心主熱兮不得眠驚悸飲水口舌乾脾主困兮多好睡吐泄瘦弱病成疳肺主氣兮多咳嗽皮乾發枯喘綿綿腎主虛兮胎氣弱小兒腎弱養應難看小兒虎口紋今人專看虎口紋風關氣關命關分風關病輕氣關重命關若過死將臨青筋紅熱黑勢惡直輕斜曲重看云脈法小兒一指分三位息數須將六至看七至八至數為熱三至四至遲虛寒堅實平和無病斷細小沉遲有病看按全嬰等書云小兒三歲以前虎口第一指上寅卯關有脈弦見者可驗病狀男左女右視之脈弦從寅關起不至卯關者病易治若連於卯關者病難治如寅連卯卯過辰關者十難救一若脈弦小或短者病可治宜參視之小兒夜啼啼哭直視熱在肝瀉青一服即時安啼哭面赤熱在心導赤麥冬效如神面赤四逆腹中痛益黃散用薑湯送夜夜見燈多拗哭父母嬌愛多不足驚風急症驚風面赤青目多直視不回睛手足搐掣牙關緊只怕昏昏再不醒驚來掐人中虎口拿總筋瀉青吞導赤調理治涼驚口眼若喎斜看他左右偏太陽頰下穴一焠自然安面色黃白神氣弱昏睡眼閉口不合口鼻氣冷手足冷慢驚搐掣時時作慢驚不可醫調元急補脾漸醒能食吉常昏不乳危吐瀉吐瀉之病麵皮黃有寒有熱有食傷面紅熱渴難調理手足寒時急補陽吐瀉常治法胃苓一粒丹脾積去食積理中補虛寒吐瀉多傷食益黃散最宜看他病略退胃苓再補脾泄瀉常如是消積功十全泄瀉作渴白朮散人參白朮茯苓甘木香乾葛藿香葉常與服之真格言瀉甚烏梅加入熱甚知母門冬虛煩甘草炙用隨症用藥不同痢症痢疾赤白皆是熱眉頭常皺腹中疼身熱脈大難得退脈小身涼容易安痢症多因積先下木香丸保和消滯積止痢用香連痢疾若不食噤口痢必殘急用香連散能食保平安小兒瘧疾瘧疾之色多黃黑病至作寒又作熱早瘧日來容易退晚瘧間來治宜急初瘧要吐痰斬鬼及常山久瘧不可截養脾功十全咳嗽形寒飲冷即傷肺咳嗽病來多痰氣面青氣促怕生驚面白胸高還不吉初咳要發表五拗並九寶氣實葶藶宜肺虛阿膠好嘗服玉液丸桔梗同甘草五拗用麻黃杏仁甘草強石膏臘茶葉發汗是奇方九寶蘇葉配麻黃薄荷陳皮杏桂良大腹桑白同國老烏梅加入細參詳疳癆面色黃白是疳癆肚大頸細頭髮焦折乳傷食大病後只怕時時熱來潮疳症無多法集聖初如神面色轉紅活相間服胃苓潮熱如不退只防作慢驚傷食傷食發熱面赤紅噁心腹脹痛時攻露身怕熱不思食症與傷寒大不同傷食宜調解藿香散最宜保和同與服病退再養脾若是成驚搐惟有下為奇傷食發熱用藿香蘇葉香附朴陳蒼半夏黃連甘草曲茯苓引子用生薑傷風傷風發熱面色赤煩悶不困不思食喜人偎抱畏風寒作渴便祕里必實惡寒病在表敗毒拿法好裡實三黃丸驚來瀉青討敗毒發表用羌防升麻柴葛解肌涼前胡枳殼甘草桔蘇葉人參用成湯浮腫小兒浮腫因風濕久瘧脾虛亦有之上身主風下主濕養脾一法少人知遍身若浮腫胃苓丸里求避風行浴法切莫用牽牛肚大有青筋燈火叉處焠內用集聖丸胃苓宜相兼口瘡小兒鵝口瘡白屑珠礬良赤瘡姜連散洗心是奇方洗心散內用麻黃荊芥薄荷赤芍當白朮將軍同國老臨時煎服入生薑牙根爛成瘡走馬疳可防出血又作臭文蛤散宜良小兒口流涎滯頤脾虛寒益黃加蒼朮不治必成疳疥瘡遍身疥瘡是何因血熱由來胎毒成痛癢不安多夜哭切莫入腹命歸冥疥瘡不宜搽胡麻丸最佳入腹宜解毒驚來莫治他雜症小兒吃泥土脾熱用泄黃集聖相間服疳成不可當小兒合面睡原來熱在心只用導赤散瀉心與涼驚小兒多白尿落地如米泔胃苓鹽湯送數服解憂煎小兒大便清邪熱在肝經只用泄青丸此法效如神小兒糞焦黃邪熱在脾鄉誰知泄黃散端的是奇方五臟外症吐泄瘧疾病在脾驚風心肝兩經為咳嗽哮喘病在肺發稀骨軟腎元虧五軟病症如小兒五軟有胎稟不足軟者有大病後軟有誤服涼藥軟者胎稟軟者地黃丸主之大病後軟者參苓白朮丸主之誤服涼藥軟者加味八味地黃丸主之以上三症若不急治有傷真元久則成痿以致不可治者多矣
