body:
  text: 卷之五瘧疾門瘧疾治法有二新瘧先截後補久瘧先補後截凡瘧要分早晚治之如上半日發者此邪在陽分氣位也先用平胃散加常山草果截之後用平瘧養脾丸調理而安如下半日發者此邪在陰分血位也輕者以四物湯加桂枝桃仁紅花發出血中寒邪甚者以小柴胡湯加升麻當歸提到陽分然後以小柴胡湯加常山草果截之略愈以平瘧養脾丸調之而安如瘧來寒多熱少者以平胃散加常山桂枝草果仁截之熱多寒少者以白虎湯加常山草果青皮截之寒熱相半者用小柴胡湯加常山草果截之後以平瘧養脾丸調之如大人以補中益氣湯調之以上數症皆先截後補也如久瘧連綿不退者或二三日一次其邪已深不可妄用截藥只以平瘧養脾丸調之有汗要無汗無汗要有汗其瘧易退再要避風寒禁雞魚冷水無不安者如犯禁戒雖九轉靈丹亦難治也凡瘧後轉作痢症者此症多得於夏末秋初因內有伏陰多傷生冷故也當從虛治不可妄用通利之藥如平常下痢者以香連丸米湯送下如瘧痢並作者以平瘧養脾丸橘皮和中丸相間服之如瘧後遍身浮腫者此因汗後受風故也以胃苓丸加五加皮大腹皮燈心長流水煎湯治之大兒加減胃苓湯治之外用浴法於日當午時向避風處以溫水拂拭遍身略睡一時以被蓋之微汗為度每日依此行之為妙甚效如瘧後腹脹或喘或不喘者此因內傷生冷脾肺俱病故也蓋脾主脹喘屬肺以塌氣丸消脹以葶藶丸定喘治之後以集聖丸調之如瘧後腹中有痞者此瘧母也因多食冷水所致亦有熱而成者治以月蟾丸主之凡瘧後形體黃瘦者只以集聖丸調之平胃散此治濕養脾之藥也蒼朮米泔浸炒一錢二分厚朴薑汁炒一錢陳皮二錢甘草一錢加常山三錢草果三錢薑棗引四物湯見痢疾門此藥性平治血不足之聖藥也桂枝湯此發散風邪之要藥也桂枝赤芍甘草薑棗引小柴胡湯此半表半裡之藥也柴胡二錢黃芩一錢五分半夏七分人參七分甘草五分加山梔丹皮名加味小柴胡湯薑棗引心中飽悶加枳殼桔梗痞滿加黃連枳實口渴加知母石膏內熱甚錯語心煩不得眠者合解毒湯白虎湯此藥性寒所以治熱也石膏五錢知母二錢粳米一勺甘草七分水煎服以上諸方截瘧必用常山草果者蓋此二味乃治瘧必用之藥也補中益氣湯此補中氣不足之聖藥也黃耆人參甘草柴胡升麻白朮當歸陳皮水煎薑棗引有汗用白朮無汗用蒼朮治瘧加青皮加減胃苓湯此滲利之聖藥也豬苓澤瀉赤茯苓白朮官桂五加皮蒼朮陳皮厚朴甘草木通大腹皮防風生薑皮燈心薑引取順流水煎服平瘧養脾丸歸身人參陳皮去瓤各一錢黃芩二錢草果仁一錢南星炮一錢白朮一錢五分白茯苓一錢柴胡一錢五分甘草炙五分共為末米糊丸如黍米大竹葉炒米湯下一方加常山黃耆鱉甲醋炙黃色月蟾丸木香人參黃耆當歸桔梗使君子肉黃連三稜炮枳實莪朮煨鱉甲炙苦楝根皮乾蟾燒存性訶子肉夜明砂緑礬各等分共為末醋糊丸陳米湯下祖傳治瘧之法以斬鬼丹截之胃苓丸調之常用平胃散加常山草果為末每服一字於臨發日五更用桃柳枝七根煎湯調服治大人瘧疾方人參五分常山酒炒三分檳榔三分草果仁四分緑豆粉炒甘草炙貝母三分青皮五分水煎服又方常山檳榔一個當歸蒼朮甘草陳皮先一服用酒擂細滾酒泡服如不效將桃枝七根燈心七根水煎二三滾露一宿發日五更溫服禁生冷雞魚發物西江月瘧疾來時潮熱內傷外感生痰初時截法似神仙不可養虎遺患外感小柴飲子內傷平胃為先內加草果與常山東面桃柳枝煎截後才調脾胃只消清瘧養脾祛邪補正作良醫不讓仲陽錢氏瘧久若成痞塊面黃腹滿消肌月蟾集聖是根基此個方兒密記如是小兒久瘧或於午後來潮又如間日又三朝截法不宜急暴只用養脾清瘧相兼集聖和調神丹斬鬼莫輕饒發日五更分曉瘧痢如逢並作其間吉凶須知大端飲食要如時胃氣完全可治若是不思乳食強將脾胃扶持胃苓丸子莫差池間以香連止痢久瘧多成壞症脾焦肚大青筋頸干腳細減元神飲食全然不進面目虛浮怯弱四肢無力難行不須醫治枉勞心九死一生危病平瘧養脾用人參白朮陳皮當歸身茯苓厚朴薑汁炒蒼朮五錢米水浸粉草半夏浸七次青皮柴胡與黃芩常山草果二錢半鱉甲三錢效如神發熱門小兒凡病有熱症既不同治亦多異須分虛實不可妄用汗下也傷風發熱其症汗出身熱呵欠目赤澀多睡惡風喘急此因解脫受風所致宜疏風解肌退熱先服柴葛解肌湯發去風邪熱退之時再服涼驚丸以防內熱傷寒發熱其症無汗身熱呵欠煩悶項急面赤喘急惡寒口中氣熱此因解脫受寒所致宜發散寒邪退熱鎮驚先服惺惺散發去寒邪後以涼驚丸以防內熱以上二症如小兒稟賦原實者可用涼驚丸若虛怯者不如只用胃苓丸甚效如傷風寒發熱又吐瀉者不可發散此脾虛怯也只以五苓散吞理中丸甚效傷熱發熱多得於夏其症身熱自汗作渴昏睡手足俱熱此因天氣已熱包裹太厚重受其熱也先以白虎湯調益元散以解其熱次服調元生脈散以補正氣傷暑發熱亦多得於夏其症身熱自汗作渴昏睡手足冷此由陰室中貪涼太過所致服調元生脈散補其元氣次服四君子湯以防吐瀉之病如夏月汗出當風以致身熱渾身自汗不止者此名暑風四君子湯加麻黃根黃耆以去風次以益元散以去熱傷食發熱其症手心肚腹尤熱噎氣吐乳大便酸臭或腹疼多啼飽脹喘急不思乳食此因飲食過度所傷宜先用利藥去其積用丁香脾積丸復以集聖丸調之如傷食已久日漸黃瘦無時作熱者不可下之輕者保和丸重者集聖丸百無一失痘疹發熱其症面燥腮赤目胞亦赤呵欠煩悶乍熱乍涼咳嗽噴嚏手足指冷驚怖多睡此由時行痘疹各相傳染宜清熱解毒惟痘疹宜參蘇飲加木香麻痘宜用荊防敗毒散不可妄施汗下恐生變症若變蒸發熱此小兒常症不須服藥見本門潮熱者當分二症有時間發熱過時即退來日依時復發其狀如瘧此肺熱也有早晚發熱每日兩度如潮水之應期者此胃熱也蓋因感觸邪氣以致血脈凝滯不得流通若不治之變為驚疳者多矣肺熱地骨皮散主之胃熱三黃丸下之如虛熱者用集聖丸調之驚熱者遍身發熱面青自汗心悸不寧脈數煩躁顛叫恍惚此心熱也以涼驚丸退熱安神丸定心夜熱者但夜發晝退此血虛症也以人參當歸散治之更兼抱龍丸以防作搐餘熱者傷寒汗後而熱又來乃表裡俱虛氣不歸元陽浮於外不可再用寒涼之藥古人戒之當和胃氣使陽氣收斂其熱自退人參蒼朮主之甚者四君子湯加炒乾薑即效疳熱者形色黃瘦食不長肉骨蒸盜汗泄瀉無常肚大腳小此多得於大病之後失於將息又或傷飽失飢用集聖丸調理壯熱者一向熱而不已由氣血壅實五臟生熱鬱蒸於內則睡臥不安精神恍惚熏發於外則表裡俱熱躁急喘粗甚則發驚癇先以導赤散瀉青丸以治其熱後以抱龍丸鎮其驚如實熱大小便祕者三黃丸下之煩熱者心躁不安五心煩熱四肢溫壯小便赤色宜導赤散加麥冬山梔仁治之再以涼驚丸撤其餘邪積熱者頰赤口瘡大小便赤澀此表裡俱實或內傷酒面煎煿熱藥峻補外因厚綿爐火所侵皆能生熱此內外蘊積之熱也非食積先以三黃丸下之後以涼驚丸調之虛熱者或因汗下太過津液虛耗或因大病之後元氣受傷皆能生熱其症困倦少力面色青白虛汗自出神慢噓氣軟弱手足厥冷此氣血俱虛氣虛則發厥血虛則發熱也四君子湯加炒乾薑甚者加熟附子一片待熱少退以涼驚丸調之客熱者陽邪干於心也心若受邪則熱形於額故先起於頭面而身熱恍惚多驚聞聲則恐此由正氣虛而邪氣勝故與之交爭發熱無時進退不定如客之往來先以導赤散去其邪後以涼驚丸調之癖熱者由乳食不消伏結於中致成癖塊以生內熱熏灼於外集聖丸主之瘧熱者寒熱往來有頭痛汗出者有嘔吐不食憎寒壯熱作渴者有遍身疼痛者或吐瀉者症既百出病非一端頭疼汗出及遍身疼者小柴胡湯加蒼朮羌活治之腹痛者脾積丸下之作渴者白朮散治之吐瀉者理中湯治之後用平瘧養脾丸調之血熱者每日巳午時發熱遇夜則涼此心熱也輕者導赤散重者四順飲治之柴葛解肌湯柴胡乾葛黃芩桂枝赤芍人參甘草竹葉七皮薑棗引惺惺散人參白朮白茯苓甘草桔梗天花粉細辛防風川芎加麻黃薄荷葉薑引調元生脈散黃芩人參麥冬甘草五味子水煎服參蘇飲人參半夏茯苓甘草桔梗枳殼乾葛前胡木香蘇葉陳皮薑棗引防風敗毒散生地防風連翹升麻荊芥穗牛蒡子酒柏人參桔梗甘草水煎服地骨皮散知母柴胡甘草炙地骨皮赤茯苓半夏薑三片引水煎服人參當歸散人參歸身生地黃地骨皮柴胡甘草生薑引四順散解小兒膈熱當歸大黃酒蒸赤芍甘草水煎服祖傳治發熱不問其症脾胃虛弱者以胃苓丸竹葉炒米湯吞元氣虛者以涼驚丸竹葉薄荷燈心湯送下隨症用引西江月小兒病則生熱須知得病根苗風寒外感熱來潮飲食內傷煩躁吐泄瘧痢瘡疥變蒸痘疹如燒骨蒸體熱漸成癆調治般般分曉若是風寒外感面紅又惡風寒惺惺散子妙難言有咳參蘇效驗飲食內傷可下三黃脾積相參再加集聖保平安莫使脾虛難轉吐泄胃苓最妙赤白痢用香連瘧家平瘧解邪干瘡疥胡麻丸散變蒸小兒常病不須妄用湯丸如逢痘疹別科傳集聖專調疳軟治熱汗下休錯誤汗誤下傷人應汗而下痞滿侵應下而汗驚定只為不明表裡致令兒命早傾果難捉摸且因循藥用胃苓集聖哮喘門哮喘之症有二不離痰火有卒感風寒而得者有曾傷鹽水而得者有傷醋湯而得者至天陰則發連綿不已輕則用五虎湯一帖重則葶藶丸治之此皆一時急解之法若要斷根常服五聖丹外用灸法五聖丹天南星煨一兩半夏泡七次陳皮去白鹽水拌一兩甘草四錢杏仁四十九粒另研先以南星半夏二味研末薑汁皂角汁拌勻和作餅又將甘草陳皮研末取竹瀝一碗以藥和成餅子焙乾又浸濕又焙乾竹瀝盡為度再研杏仁泥蒸蜜和為丸臨時噙化一丸以薄荷湯送下灸法取心穴右背上足三里穴各三壯仍禁酸鹹辛熱之物西江月哮喘症雖有二皆由痰火中藏或被風寒襲外方內被鹽水醋嗆亦有乳嗆而得致令攻腠為殃用藥調理法雖良斷根灸法為上哮喘多成宿疾天陰欲雨連綿治時發表及行痰九寶時常靈驗表邪未除五虎裡實葶藶為先不須砒石作成丸誤了孩兒命短咳嗽門咳嗽治法有三有發汗有下泄有清補如初起挾風寒外感者輕則蘇沉九寶湯重則五虎湯一帖即效如咳久身熱喘急此肺中伏火也以葶藶丸利之如咳久肺虛連綿不已即當補肺阿膠散主之如咳久連聲不已口鼻出血者茅根湯主之如夏月得咳嗽者以加味白虎湯治之不可汗下方見瘧疾門如咳痰甚者以利痰丸主之方見驚風門如咳久成龜胸者以葶藶丸主之如咳嗽吐血者二陳湯加薑汁主之如咳嗽咽痛聲嗄者以甘桔湯主之蘇沉九寶湯此發散之藥也桑白皮去赤甘草大腹皮官桂陳皮蘇葉麻黃不去節烏梅一個薄荷葉杏仁不去皮尖各等分薑引水煎服微汗為度五虎湯此發散之上藥也麻黃七分杏仁一錢甘草四分細茶炒七分白石膏一錢五分水煎服發汗禁風葶藶丸泄肺喘通水道甜葶藶略炒黑牽牛炒杏仁去皮尖炒漢防己各等分共為末然後入杏仁泥和之棗肉同搗為丸淡薑湯送下阿膠散定喘消痰止嗽此補肺之藥也牛蒡子甘草杏仁馬兜鈴阿膠粉炒成珠糯米水煎服茅根湯陳皮去白半夏炒茯苓甘草天冬去心杏仁泥黃芩梔子貝母知母石膏瓜蔞霜生地桔梗水煎取茅根自然汁和服凡咳嗽日久面青而光其氣喘促哽氣時多出聲唇白如練此肝氣旺而肺氣絶者不治凡咳嗽日久喉舌生瘡其聲嗄者不治凡咳嗽日久胸高而喘肩與胸脅俱動加驚搐者不治凡咳嗽日久潮熱喘急一咳之時面青黑目上竄血從口鼻長出者此木火旺盛而肺已絶不治凡咳嗽日久面白唇青目閉悶亂頭搖手擺者此肺氣將絶不治西江月小兒或病咳嗽醫家症要分明咳為有傷於肺經嗽則脾家病症有聲無痰是咳無聲有痰嗽真時乎咳嗽病同臨有聲有痰一定小兒傷風咳嗽其症身熱憎寒自汗躁煩不安然日夜嗽聲無遍時常鼻流清涕咽喉不利痰涎脈浮頭痛症多端治則宜乎發汗咳嗽或傷寒症此因飲冷形寒冬月坐臥濕地間抑被冷風吹犯其症脈緊無汗煩躁不渴惡寒治宜發散汗為先藥用參蘇飲驗若是咳嗽傷熱其症面赤躁煩飲水不止膈咽乾咳唾稠黏症現甚則急喘而嗽痰涎必生喉咽潮熱手足或冰寒小兒多有此患咳嗽若患火症決然咯唾血膿甚者七竅血流通此是肺熱火動若吐青緑白水胃冷停飲相攻嗽吐痰涎乳食中宿滯不消取用要知治嗽大法依時認症扶持春天外感症無疑夏是炎上火氣秋則肺傷濕熱冬為風冷相隨相時而動作良醫對症依方用劑大抵實者當下虛則補藥為宜寒者溫散藥中推熱症清涼為貴風則尤當發散停痰消逐為施初然止澀莫投之總要化痰順氣肺乃五臟華蓋皮毛易感風寒初醫發汗最為先杏仁麻黃最驗薄荷石膏甘草黃芩桔梗人參前胡枳殼臘茶煎一服諸風發散久咳不宜發汗化痰順氣為宜潤下玉液有神奇不效再行湯劑貝母陳皮枳殼茯苓甘草芩梔前胡薄荷杏仁泥有熱石膏堪取久咳痰壅發熱看他二便何如若還清利是中虛只用抱龍區處如果祕結實熱葶藶五色驅除要分虛實不須拘此是小兒命主久咳連聲出血清金降火為佳芩連甘桔款冬花知貝二冬多下去白陳皮枳殼前胡地骨霜瓜茯苓玄參茅根加此個方兒無價大凡咳嗽治法必須清化痰涎化痰順氣最為先氣順痰行咳減順氣陳皮枳殼化痰半夏天南黃芩梔子火邪干桔梗茯苓開滲虛咳時加作熱面黃氣短無神當歸陳皮白茯苓梔子黃芩桔梗知貝前胡天麥甘草枳殼人參更加黃柏妙如神煎用生薑作引久咳連聲不已面青目竄常籲胸高肩息汗如珠臉白唇青背屈骨瘦如柴潮熱鼻乾發燥神虛啞嗄驚搐不須拘縱有靈丹無處蛤蟆瘴論症治歌咳嗽小雞鳴痰多吐血淋升麻湯一劑管叫得安寧心腹痛門心腹痛有六有寒有熱有食有積有蟲有霍亂凡小兒外感風寒內傷冷物胃氣當心而痛啼哭悶絶手足冷或吐或不吐以熱手按摩則止者用草豆蔻丸主之凡小兒受寒繞腹疼痛叫哭不寧手足冷汗出或泄或不泄得熱稍定以理中湯主之凡小兒腹痛無時舉發者此積痛也不可數下下則氣傷而難愈以集聖丸調之凡小兒飲食之後卒然腹痛此傷食也須問其平日曾有此疾否若原無此疾作傷食看以丁香脾積丸利去所傷之食用原傷之物煎湯送下後以集聖丸調之若原有此疾當作積論凡小兒心腹疼痛嘈雜口吐清水面黃肌瘦得食即止肚飢又作嘈雜痛此蟲痛也先用雄黃解毒丸苦楝根白皮煎湯吞下追去其蟲後用集聖丸調之如元氣弱者不可下只用集聖丸主之凡小兒晝則無事夜則啼哭此腹痛也蓋腹屬陰痛主寒遇夜則發陰寒甚也以理中丸燈心燒灰煎湯下草豆蔻丸草豆蔻麵包煨去油一錢陳皮六錢澤瀉半夏各一錢桃仁去皮尖七粒麥芽炒二錢半神麯炒柴胡薑黃各四錢共為末湯浸蒸餅為丸白湯下丁香脾積丸丁香良薑醋炙各五錢木香巴豆霜三稜煨莪朮各三錢青皮醋浸去白五錢皂角燒存性二錢百草霜四錢共為末醋糊丸有積茴香湯下傷食原物湯下水瀉者甘草湯下祖傳治腹痛甚者解毒丸下之輕者脾積丸下之凡小兒心腹痛急面青手足冷指甲青目上竄悶亂煩躁狂言邪語噴藥喘急者皆不治西江月凡遇小兒腹痛必須察認原由面黃腹痛食中求臉白蛔蟲作楚指冷麵青寒痛三家啼哭無休或溫或下藥先投不可臨時差謬積痛先行脾積養脾以次調和蟲家別用取蟲科集聖勤勤服可寒痛理中最妙茱萸湯引宜多無時腹痛又如何集聖妙如利藥積痛有時發作面黃腹脹難痊丁香脾積下當先後用養脾調緩蒼白青陳曲麥茴香莪朮三稜砂仁靈脂木香兼枳實黃連川楝蟲痛時時作楚面白清水長流檳榔蘆薈與糖毬君子蕪荑楝肉白朮木香靈脂黃連辰砂莪縮青陳乾蟾與麥曲蟲去痛除是福疝氣門疝氣初得屬寒久則屬火凡小腹疼痛外腎腫硬者此名疝氣蓋由小兒久坐濕地以致寒氣內侵於腎而得所以小腹刺痛外腎腫硬但左為偏墜右為膀胱輕者內服五苓散加茴香川楝子橘核檳榔少加木通屢試屢效甚者加附子一片即效後服茱萸內消丸調之外用敷藥及熏洗法凡小兒性急多啼有傷於脾肝以致睪丸腫大下墜者小腹不痛但外囊浮大汩汩有聲此宜二陳湯去甘草加海藻昆布荔枝核小茴香川楝子為末順流水調服更以瀉青丸去大黃加青皮相間服之敷藥用蚯蚓糞不拘多少為細末以蔥汁調敷腫處一日一換以消為度熏法用蔥捶研細煎百沸湯入鹽少許以瓶盛之令小兒正坐其上蒸其腫處待水溫洗之後加敷藥灸法牽小兒陰莖向胯側比之盡處是穴左則取左右則取右並灸三陰交穴各三壯祖傳治小兒疝氣偏墜用茱萸內消丸外用敷藥西江月疝氣如何而得下焦熱結膀胱腎囊腫大似茄樣左右墜難抵擋內服茱萸丸子外用龍土蔥湯待他痛止腎消囊再灸兩邊胯上我有得傳妙法橘核木香沉香茴香大小用相當食鹽故紙為上巴豆少炒川楝去巴取楝如常研為細末酒調嘗一服汗淋停當浮腫門浮腫治法開鬼門者發汗也潔淨府者利小便也凡小兒面目遍身浮腫者或因胎稟虛弱卒冒風濕或因瘧疾汗後不曾禁風皆成此症輕者用胃苓丸治之重者用加減胃苓湯治之凡小兒浮腫又加喘急者此脾傳肺也當傳治脾而兼治肺日服加減胃苓湯夜服葶藶丸如先喘急而後面目浮腫者此肺傳脾也當專治肺而兼治脾日服葶藶丸夜服胃苓湯加麻黃杏仁如先浮腫而後腹脹者此表邪傳裡也只以加減胃苓湯主之凡浮腫不可妄用汗下更不宜用大戟甘遂牽牛之類以傷元氣加減胃苓湯陳皮蒼朮厚朴薑汁炒甘草豬苓赤茯苓澤瀉木通白朮官桂滑石防己五加皮生薑皮因喘而致者加麻黃杏仁桑白皮腹脹者加大腹皮木香檳榔蘇梗去甘草氣虛者加人參燈心引順取長流水煎溫服浴法於午時煎蔥百沸湯避風處浴之蓋覆略取微汗日日依此行之效祖專治浮腫只用胃苓丸用長流水五加皮燈心煎湯吞外用浴法凡浮腫氣促面黑脈微細不飲食者不治西江月小兒病患浮腫或因胎氣羸虛卒冒風濕外邪欺以致渾身腫起又或諸病汗下脾虛又被風吹遂爾浮腫堪憂慮症別輕重用劑輕用胃苓丸子重則加減堪行再用浴法保安寧此法古今永定不可太施汗下太補亦不宜行能依方法救孩嬰方可稱為司命大抵浮腫治法鬼門淨府須知木通防己五加皮蘇葉車前滑石滲濕四苓飲子補脾平胃須宜燈心長流水煎之每日清晨早吃要識浮腫死症氣促面黑鬚憂脈微細小不堪謀飲食不飧難救臍翻糞如羊屎泰山倒了難扶忽生大喘肺經虛縱有靈丹何救脹滿門脹滿專屬於肺有虛脹積脹熱脹寒脹虛脹者或因吐泄或誤服下藥致成脹滿者此宜補中調氣利小便以四君子湯去甘草加厚朴陳皮蒼朮木香木通治之蓋中滿忌甘草所以去之若厚朴乃脹滿必用之藥積脹者腹中原有食積結糞小便黃腹時作痛微喘脈實時時飲水又不能食者可下用丁香脾積丸下後以集聖丸調之如脾胃素弱不能消導運化傷食作脹者先補脾四君子湯去甘草加厚朴陳皮砂仁後以脾積丸下之後又補脾集聖丸主之輕者只以保和丸調之熱脹者渾身壯熱面赤煩躁大便祕此因胎稟素厚誤服藥而致者急以三黃丸下之不通者用膽導法下後以胃苓丸調之寒脹者因寒積鬱結而脹手足厥冷面青氣急先以塌氣丸治之後以胃苓丸調之凡脹滿喘急除寒脹一症其餘俱以葶藶丸治之亦有遍身瘡疥因淋洗塗搽逼毒歸內而腹脹者輕則敗毒散治之重則解毒丸下之瘡出脹消而愈如面青黑氣上急手足冷目直視或目閉嘔乳者皆不可治塌氣丸胡椒一兩蠍梢去毒五錢共為末麵糊丸陳米飲下一方加萊蔔子名褐丸子敗毒散荊芥防風連翹枳殼升麻薄荷葉羌活獨活桔梗乾葛木通金銀花黃芩川芎甘草山梔子上腫加蔥三莖下腫加燈心一握薑三片引水煎服凡腫脹大小便不通嘔吐者不治臍突背平者不治凡腹脹喘急氣長出目閉不食者不治凡腹脹喘促驚搐悶亂者不治祖傳治脹滿以解毒丸下之胃苓丸調之西江月腹脹名為惡症寒熱虛實分明忽然飽悶勢猙獰傷食熱家體認吐泄脹而寒取大便祕而實因四肢浮腫濕家尋痞瘧久成虛病傷食脹而急下下後還用保和若是寒脹理中可塌氣神方不錯祕結三黃葶藶木香順氣宜多胃苓又是濕家科痞瘧月蟾堪妥實證悶亂喘滿治宜白餅靈丹其症氣喘作虛看溫藥補養方驗二術參苓厚朴陳皮木香當參更加木通利小便此藥虛症可咽凡治小兒虛脹先服塌氣神方不愈食積腹中藏糞結小便黃樣但覺時間微喘飲水能食如常脈浮而實下為良下後再宜補養大抵腹脹急症背平臍突多凶二便祕結下難通反吐水漿堪痛氣喘脹家常病只愁目閉疲癃面浮腳細黑筋叢集聖丸子妙用小兒腹脹多因食山楂曲麥術青陳甘草砂仁同入內寒加茱藿熱加芩小兒患腹脹紫蘿葛陳甘食少加白朮煎服自然安黃疸門黃疸不必分五樣總是濕熱凡小兒身皮目皆黃者黃病身痛背強大小便澀一身面目指爪俱皆黃小便如屋漏塵水色著物皆黃渴者難治此黃疸也其症多得於大病之後以茯苓滲濕湯主之如小兒生下百日及半年不因病後身微黃者胃熱也加減瀉黃散主之如面黃腹大吐食而渴者脾疳也集聖丸主之又有自生而身黃者胎疸也地黃湯主之若淡黃兼白者胃怯白朮散主之如夏月身體蒸熱胸膈煩滿皮膚似橘白睛亦黃筋骨痿弱不能行立者脾胃鬱熱也加減瀉黃散主之通治黃疸茵陳五苓散尤穩如吐瀉黃疸三稜湯主之茯苓滲濕湯白茯苓澤瀉茵陳豬苓黃芩黃連梔子防己白朮蒼朮陳皮枳殼水煎徐徐溫服加減瀉黃散黃連茵陳各五錢黃柏黃芩茯苓梔子各三錢澤瀉二錢水煎服三稜湯三稜莪朮青皮陳皮神麯麥芽甘草黃連白朮茯苓傷食吐瀉加山楂時氣吐瀉加滑石發熱吐瀉加薄荷水煎服祖傳治黃疸以胃苓丸一料加茵陳末五錢同為丸用竹葉燈心車前子煎湯吞服凡發黃大渴不止面黑鼻氣冷寸口無脈者不可治諸汗門汗者心之所藏在內為血在外為汗小兒氣血嫩弱膚腠未密若厚衣太暖熏蒸臟腑臟腑生熱熱搏於心故液不能自藏而額汗出也額屬心本位宜收斂心氣團參湯主之此虛汗也如大病後氣血尚弱液溢自汗或潮熱或寒熱發過之後身涼自汗日久令人黃瘦失治則變為骨蒸疳癆黃耆固真湯主之如睡中汗出不睡則無汗乃睡濃也醒覺則止而不復出汗亦是心虛此盜汗也宜斂心氣團參湯主之如睡中遍身汗出醒覺時久不幹此積症盜汗脾冷所致益黃散主之如病困睡中身體汗流此因陽虛所致黃耆固真湯主之如脾虛泄瀉自汗後遍身冷而汗出有時遇泄則無未泄則有此為大虛證急當補脾宜理中湯加熟附子待泄止又以黃耆固真湯主之凡自汗上至胸下至臍此胃氣虛也當補胃四君子湯加黃耆治之如肺虛自汗其症右臉色多㿠白脈按之無力蓋因久咳嗽連聲不已以致肺氣上壅故令汗出以四君子湯加麥冬此益母救子之義也如慢驚自汗遍身俱有其冷如冰此危症也大補湯加熟附子一片治之如傷風作熱自汗者宜救表解肌以柴葛解肌湯主之如無時冷汗出髮根如頭珠面顏上濈濈然此為驚風宜抱龍丸四君子湯加麻黃根治之凡小兒自汗上至頭下至項謂之六陽虛汗不須治之自愈凡小兒傷寒汗出至頸而止者此欲發黃茵陳湯主之凡諸汗症服前藥不止者俱加牡蠣蛤粉或止汗散調之如有實熱在內煩躁汗出不止三黃丸下之團參湯人參當歸各三錢雄豬心一個切三片每藥二錢豬心一片井水鍾半煎一鍾食前溫服黃耆固真湯黃耆人參白朮甘草炙當歸麥冬水煎服益黃散陳皮一兩青皮訶子肉粉草炙各五錢丁香二錢共為末每服二錢未周歲者只服五分水煎如感寒吐泄加薑棗大補湯當歸人參黃耆白芍生地甘草炙白朮白茯苓川芎加附子去苓芎浮小麥一撮為引水煎服止汗散以敗蒲扇燒灰燈心湯調下或酒調亦可夜啼門夜啼之症有四驚啼熱煩啼腹痛啼神不安啼驚啼者邪熱乘於心也當安心以導赤散加燈心退心熱以安神丸定心效熱煩啼者其哭無淚見燈則喜而止以導赤散加麥冬梔子仁治之腹痛啼者脾臟冷而痛也面青而光以溫中藥調理中氣益黃散治之神不安啼者睡中忽覺自哭以安神丸燈心燒灰調湯吞服又有拂其性而拗哭者要審明白不可妄投藥丸祖傳治夜啼以至聖保命丹燈心灰調湯下甚效西江月小兒夜啼四症忤驚肚痛心煩如逢拗哭忤家言睡中忽啼驚見肚痛手足厥冷腰曲口氣冰寒心熱煩躁不安眠其症面赤腹暖既辨夜啼症候其間治法須明分明傳授與人間只得心誠求遍忤驚安神丸子理中專治脾疼涼驚錠子治心煩總用燈花妙散燈花散用燈花七枚辰砂一分研末燈草湯吞疳症門丁奚者手足極細項小骨高尻削體痿腹大臍突號哭胸陷骨蒸潮熱是也哺露者虛熱往來頭骨分開翻食吐蟲煩渴嘔噦是也丁奚哺露皆因脾胃久虛不能化水穀以致精神減損無以榮其氣故肌肉消削腎氣不足復為冷風所傷故骨枯露也小兒十五以下為疳十五以上其症為癆此皆氣血虛憊腸胃受傷致之同出而異名也蓋小兒易虛易實凡病久則成疳用藥乖方飲食過度將息失宜俱成疳症俱用集聖丸加減治之小兒臟腑嬌嫩飽則易傷飲食失常不為疳者鮮矣或小兒失乳粥飯太早耗傷神氣則疳之根生故乳食稍多過飽無度則疳因傷得恣食肥甘黏膩生冷鹹酸以滯中脘則疳因積生或乳母睡臥寒暖失其調理飲食乖常喜怒房勞即與兒乳則疳因母患傳氣而入以致脾胃一傷諸臟皆弱但見目澀或生白膜唇赤身黃喜臥冷地愛吃泥土泄痢無常肚腹脹滿耳鼻生瘡頭髮作穗腳弱項小極瘦飲水潮熱進退皆其症也以集聖丸本方調之兼服參苓白朮丸百無一失有因大病妄投吐利之藥以致胃虛而亡津液內發虛熱外消肌肉者以集聖丸去莪朮青皮加人參白朮治之有因熱病不退以致津液枯燥者集聖丸去砂仁莪朮加龍膽草治之有因吐瀉下利而成疳者集聖丸去青皮莪朮加白朮肉豆蔻訶子治之亦兼服參苓白朮丸治之有因久瘧不退而成疳者集聖丸加鱉甲治之有因食積而成疳兼腹痛者集聖丸去歸芎加川楝子肉小茴香三稜治之有因蟲痛而成疳者本方去歸芎加白蕪荑川楝子肉治之有因脾胃久虛不能運轉以榮其氣或胎中受毒臟腑血少以致手足極細項小骨高尻削體瘦若前丁奚哺露之症者以集聖丸參苓白朮丸治之有因乳母恣食五辛酒面炙煿致令小兒日則煩渴飲水乳食不進夜則渴止此名疳渴以集聖丸去莪朮砂仁加人參白朮治之兼服人參麥冬散治之凡疳症熱者虛中之熱冷者虛中之冷治熱不可用涼治冷不可用溫尤不可妄施汗下以致殺人凡小兒略見黃瘦作熱肚大腹痛不思乳食者即服五疳消積丸或集聖丸治之凡治疳症不必細分五疳但虛則補之熱則清之冷則溫之吐則治吐痢則治痢積則治積蟲則治蟲不出集聖丸加減用之屢試有驗亦有無辜疳者腦後項邊有核如彈子按之則動軟而不動久則肢體癰瘡便痢膿血壯熱羸瘦頭露骨是也凡見此症速破其核有蟲如米粉膏藥貼之內服集聖丸調治集聖丸蘆薈焙乾五靈脂炒夜明砂淘去灰沙焙乾縮砂仁炒木香陳皮去白莪朮使君肉各二錢黃連川芎酒洗炒乾蟾炙各二錢當歸一錢半青皮二錢因於虛者加人參二錢白朮三錢去莪朮青皮五靈脂因於熱者加龍膽草三錢去砂仁莪朮因於瘧者加鱉甲炙焦三錢因於吐泄下痢者加白朮二錢肉豆蔻煨訶子肉各一錢五分去青皮莪朮因積痛者加三稜煨川楝子肉小茴香炒各二錢去當歸川芎因於蟲者加蕪荑一錢五分川楝肉二錢去當歸川芎因於渴者加人參白朮各二錢去莪朮砂仁上為末用雄豬膽二個取汁和麵糊為丸米飲送下參苓白朮丸人參白朮白茯苓甘草山藥白扁豆桔梗薏苡仁蓮肉各一錢加歸身一錢五分川芎七分共為末神麯糊丸米飲送下人參麥冬散人參白朮麥冬黃連甘草乾葛柴胡竹葉引五疳消積丸使君子肉炒五錢麥芽炒陳皮神麯山楂肉白蕪荑黃連膽草各等分上為末陳米飯為丸米飲送下西江月小兒疳癆又險愚夫不識根苗面無血色發毬焦肚大頸干腳小吐瀉時時舉發似瘧非瘧來潮吃泥弄舌滯頤交不治休嗟命夭小兒傷食脾胃疳癆煩熱虛羸黃連蘆薈解蒸危莪朮縮青去積當歸川芎養血夜砂君子攻蛔乾蟾木香五靈脂粟米糊丸為最大小便門凡小兒有病或熱腹痛或驚大小便不通者此症極危看虛實急通利之如小兒形實熱甚內服三黃丸外用貼臍法即通如小兒形怯不可下者用尉臍法膽導法即通如用上法不通又加腹脹氣喘多哭悶亂目上視手足冷者不可治也凡小便不通者有陰陽二症陰閉者冷濕乘虛入里因而不通五苓散加南木香為末空心鹽湯調服外用炒鹽尉臍即通陽閉者因暴熱所逼澀而不通輕者五苓散加車前子燈心治之重者以木通散外用尉臍法即通小便淋澀者蓋小腸為受盛之腑氣通於膀胱膀胱者為津液之府氣通於腎小腸受氣客於膀胱銷灼腎水水道澀而不利故小便澀痛也先以八正散泄去其熱次以香芎丸調之不論五淋治法皆同小便出血者熱之極也蓋心生血於小腸相合熱甚則失其常道故不流滲入於胞故小便血出也以導赤散加蒲黃末空心時燈心湯送下小便出白者初出微赤良久澄白如米泔狀此由乳哺失節有傷於脾致令清濁不分而色白也久則成疳以分清飲主之祖傳治小便白色如米泔者以胃苓丸溫鹽湯下小便不禁此腎與膀胱俱虛而冷氣乘之故不能制其尿出而不禁謂之遺尿睡里自出者謂之尿床俱以雞腸散治更以地黃丸調之凡大小便不通者有虛有熱虛者津液不足大腸乾澀而祕結內服通幽湯甚者用導法熱者臟腑積熱內有燥糞其腹必痛或作渴內服三黃丸外用導法大便下血者是大腸中有積熱也因恣食酒面炙煿熱物流入心肺血熱妄行滲入腸中故大便下血久則臟毒無時下血黃連丸主之凡小兒初生七日之內大小便有血者此胎毒也不可用他藥只以生地黃取自然汁入蜜少許和勻溫服之自愈凡小兒非月內大小便有血者此積熱在心肺二經熱積於心故小便出血熱積於肺故大腸出血三黃解毒湯主之若小兒出痘疹之時大小便出血者此熱毒內攻臟腑俱壞乃危症也難救凡小兒常時糞後出血不止者此名野雞痢地榆丸主之木通散木通萹蓄大黃瞿麥滑石赤茯苓梔仁黃芩車前子甘草梢燈心引八正散滑石瞿麥大黃木通萹蓄車前子山梔仁甘草梢加黃柏燈心引香芎丸香附川芎赤茯苓各五錢海金砂滑石各一錢枳殼澤瀉石葦檳榔各三錢共為末糯米粥糊丸麥冬湯送下如小便澀痛者取長流急處順水用火微溫入鹽少許調勻空心服分清飲益智仁白萆薢石菖蒲烏藥加茯苓各等分共為末燈心引水煎服雞腸散雞腸燒存性男用雄女用雌牡蠣煅白茯苓桑螵蛸微炒各五錢肉桂龍骨各二錢半共為粗末薑棗湯服地黃丸熟地酒浸焙八錢山茱萸肉山藥各四錢澤瀉丹皮白茯苓各五錢共為末煉蜜為丸溫水空心服通幽湯生地升麻桃仁泥歸身甘草紅花麻仁炒加大黃水煎調檳榔末服黃連丸黃連五錢槐米炒側柏葉炒枳殼荊芥穗各三錢地榆三錢脫肛者加蝟皮炙三錢共為末醋糊丸陳米飲送下三黃解毒湯黃連黃芩黃柏紅花木通大黃生地歸身甘草水煎服地榆丸防風烏梅肉枳殼阿膠甘草炙荊芥穗黃連生地當歸身槐花白朮伏龍肝地榆水和丸陳米飲下貼臍法用田螺大者捶爛貼臍下能開結熱尉臍法用連須蔥一根不洗去泥土生薑一片淡豆豉二十一粒鹽二匙同研捶作餅燒銚子烘熱餅掩臍中以厚綿絮系定良久氣通自利不然再換膽導法用豬膽大者一個將鵝毛筒截去兩頭一頭插入膽中用線扎定不令移動著口吹氣入膽內又以線作活套子扎定其氣將鵝毛筒向內納入穀道中取出活套捏膽汁入腹中須臾氣通自利西江月大便不通症候有虛有實不同虛為津液少流通腸澀不能傳送內服通幽湯劑外法貼導疏通若是熱症腹中疼屎燥三黃可用若是傷食症候腹中必作痛疼面黃便祕實難禁藥用九轉靈應大便若是下血大腸積熱之因連槐殼柏榆榔荊脫肛蝟皮加增糞後時常出血地榆丸子高強防風枳殼與生黃地榆當歸為上烏梅甘草訶子黃連荊芥同行伏龍槐花白朮當米醋為丸吞放小便不通症治陰閉陽閉須知陰為風冷入乘虛五苓木香加入又加靈砂為末空心鹽湯吞之外用鹽炒尉其臍熱氣流通罔滯陽閉暴熱所逼其症唇赤面紅便如點滴血鮮流五苓車前加用或用煎紅散子重者八正木通外用尉臍法即通活幼之功可頌又有濕痰下墜其兒體胖身肥喉中有痰面微紅小便落地停注其形渾如米泔此症不要胡為二陳湯內增蒼朮木通升麻加入初出有微紅色良久澄白如泔此由乳食損脾元清濁不分症現治用分清飲子或用胃苓湯丸補脾化滯法為先脾實方除此患凡治小便不通涼藥不可多施若用田螺貼其臍逼寒入腹難出宜用人參白朮茯苓甘草相隨再加車前與滑石升麻芩通併入大小二便俱閉此症果是凶危先通大便最為宜小便自然通利藥用九轉靈應車前煎水調之此般治法實為奇醫者銘心牢記大小二便下血心肺積熱相攻三黃解毒有神功黃連黃芩相共黃柏紅花生地大黃甘草木通當歸只可用其身白水煎湯相送頭項門小兒之頭四時要涼但見頭熱即有病生可預服抱龍丸小兒頭囟腫大青筋顯露者此臍熱也瀉青丸主之頭囟腫起者此因熱在內其氣上衝故而腫起宜退熱疏風瀉青丸抱龍丸主之小兒無病忽項軟者此肝熱有風也瀉青丸主之囟門下陷者此因久病臟腑虛弱氣不上行故下陷如坑參苓白朮丸主之已成疳者集聖丸主之囟門開而不合者此腎氣有虧名曰解顱乃惡病也宜內服地黃丸外用封囟法久病之後其頸軟者此天柱骨倒乃危症也當大補氣血八物湯主之以殭蠶末調服小兒生下便頸軟者此胎氣不足地黃丸主之封囟法用大南星微炮為末米醋調塗絹帛上烘熱貼之以合為度目病門黑珠屬肝白珠屬肺瞳仁屬腎兩角屬心兩胞屬脾目內赤者心經積熱上攻導赤散加黃連防風方見驚風門祖傳治小兒目赤者以涼驚丸菊花煎湯下目內黃者脾熱也瀉黃散主之目胞腫者同治目連眨者肝有風也凡病或新或久皆引肝風目屬肝風入目上下左右如風吹兒不能任故連眨也用瀉青丸主之方見驚風門目直視者肝有熱也熱入於目障其筋脈目之兩角俱系不能轉視故目直也俱用瀉青丸主之凡小兒初生其目閉者此胎熱也內連服生地黃湯外用膽草煎水洗目上一日七次恐緩則損目小兒生下眼胞赤爛者此因生時洗拭不淨以致穢汙漬兩角中故兩胞赤爛至長不瘥真金散主之小兒久嗽其目兩眶紫黑如物傷損白珠紅赤如血謂之血眼內服玉液丸外用貼法小兒生下日久之後目不見物者謂之雀目此肝虛也用地黃丸治之以豬羊肝吞壓小兒痘疹之後目內有膜者以穀精散主之小兒熱病其目羞明喜暗者此風熱也宜解風熱以清陽散火湯主之小兒吐瀉後目有白膜閉不能開及無精光者難治瀉黃散藿香葉七分山梔仁一錢石膏五分甘草七分半防風二錢上銼細用蜜拌炒但微炒為末水煎溫服真金散黃連黃柏當歸赤芍各二錢杏仁去皮尖五錢上銼細用乳汁浸一宿曬乾為末生地黃汁調一字頻頻點眼以新帛蘸荊芥湯洗之生地黃湯生地黃赤芍川芎當歸甘草天花粉各等分為末每少許燈心湯調服貼藥用生地黃黑豆濕研成膏貼目上其血自散如血淚既出腫黑自消甚妙穀精草散穀精草一兩蟬蛻去翅足三錢密蒙花五錢白蒺藜炒去刺三錢共為末每用一錢取雄豬肝一兩竹刀剖開擦藥於內以草束定水煮肝熟令兒食肝飲湯清陽散火湯黃芩荊芥穗川芎防風薄荷葉甘草連翹山梔仁當歸石膏羌活水煎溫服小兒驚風目斜視而不轉睛者灸風池穴目左斜灸右穴右斜灸左穴西江月小兒眼目多病皆因自食酸甘臟生邪熱炙其肝沖發於目為患或為赤腫癢痛或多眵淚遮幔甚則翳膜掩瞳間更有睛盲雀眼眼目部分當識五臟各屬一位黑珠屬肝白珠肺瞳仁又屬腎水大小兩角雖異心火是則屬之上下兩胞屬何如脾上中央定位目內若見赤色心經積熱上衝導赤加連並防風更有洗心堪用又或現出黃色此為脾熱蒸攻瀉黃散子有神功此方又醫浮腫小兒目患赤痛難用點藥醫攻只將湯藥內疏通外用敷藥止痛湯藥洗心肝散敷藥田螺連同二味共研要通融紙攤貼之休動如或要用點藥莫將眩藥妄行只把黃連細研勻將大田螺水浸藥末納入螺內須臾黃水流行蘸水點入眼中存熱退涼生痛定目痛肝家風熱瀉肝散是仙方外用乳洗目清涼勿使點藥輕妄久病目生白膜肝虛之症消詳虛則補母用地黃養血養精為上耳病門耳竅屬腎耳珠前屬少陽耳病有五皆由於腎經氣實熱氣上衝於耳遂使津液壅而為膿為清汁也亦有因沐浴水入耳中灌為聾耳內服蔓荊子散外用龍骨散搽之耳珠前後生瘡浸淫不愈者黃藥散主之耳旁赤腫者此熱毒也若不急治必成大癰外用敷毒散內服消毒飲凡暴聾者此氣閉也通竅丸主之百蟲入耳者以清油灌之其蟲即出又用兩刀於耳邊磨其蟲聞磨刀聲即出膿耳方用蛇蛻焙黑存性研末吹入耳中甚效蔓荊子散蔓荊子甘草乾葛花升麻赤芍前胡桑白皮炒木通麥冬生地黃赤茯苓薑棗引水煎服龍骨散龍骨白枯礬各三錢麝香少許黃丹煅二錢胭脂一錢共為細末以綿展干膿用筒吹藥入耳黃藥散黃柏白枯礬海螵蛸滑石龍骨各等分為末濕用干搽乾用豬油調敷敷毒散用緑豆粉不拘多少或豆研細末以淡醋調敷腫處干則易之消毒飲羌活防風黃芩連翹桔梗甘草人參川芎當歸柴胡水煎服通竅丸用磁石一錢為末麝香五釐同研成丸如棗核大綿裹之納耳中又以鏽鐵一塊熱酒泡過含口中須臾氣即通矣西江月尋常耳中水出日久乾結難通雖然聤耳不為凶只恐成膿堪痛治在少陽風熱腎經濕熱同攻紅綿鱔血可消膿方子分明選用鼻病門鼻為肺之竅鼻塞者蓋肺氣不通於竅然肺主皮毛風寒外感則肺氣壅閉而鼻塞川芎膏主之鼻涕者肺為風寒所襲而津液不收則為鼻涕細辛散主之齆鼻者肺受風寒久而不散膿涕結聚不開使不聞香臭則齆矣萬金膏主之以上三症皆宜疏利俱用加味麗澤通氣散鼻乾者心脾有熱上蒸於肺故津液枯竭而結當清熱生津導赤散吞抱龍丸治之如痛已極鼻乾而黑竅張長出冷氣者此肺絶也必死之症鼻淵者流下唾涕極其腥臭此膽移熱於腦又名腦崩辛夷散主之凡小兒初生三朝五日一臘忽然鼻塞不能吮乳不得呼吸者因乳母安臥之時而不知回避鼻中出氣吹著兒囟門或因洗浴用水溫冷又不避風邪所以致兒鼻塞通關散治之鼻衄者是五臟積熱所為也蓋血隨氣行今得熱則熱氣動而妄行溢出於鼻也宜涼血為主內服加減地黃湯外用吹鼻散川芎膏川芎細辛藁本白芷甘草各三錢龍腦五分麝香五分杏仁去皮尖七粒共為末煉蜜為丸燈心湯化服如體弱者綿裹一丸塞鼻孔中男左女右細辛散細辛前胡防風川芎人參甘草各等分為末乳香湯調服萬金膏羌活川芎細辛木通麻黃石菖蒲各一錢龍腦少許麝香少許加味麗澤通氣散羌活獨活蒼朮防風升麻荊芥穗葛根甘草炙細辛麻黃白芷川芎木通薑三片棗二枚蔥白三寸水煎食後服辛夷散辛夷仁五錢蒼耳子炒二錢半白芷一錢薄荷葉五分黃連一錢共曬乾為末蔥湯調服通關散香附子川芎荊芥穗殭蠶細辛牙皂共為末以蔥白搗成膏攤絹紬上烘熱臨臥時貼囟門加減地黃湯生地黃芩梔子仁赤芍鬱金茅花引水煎入車前草自然汁細細服之吹鼻散山梔仁亂頭髮燒灰共為末吹入鼻中祖傳治衄血用神芎丸茅花煎湯下西江月小兒若是鼻塞風寒各有根由傷風清涕必長流乾燥傷寒熱搐清涕荊防發散乾燥火熱中求芩連梔柏可同儔引用蔥薑平復忽然鼻中衄血五臟積熱所為血隨氣上溢於鼻治用涼血為主川芎當歸赤芍生地黃芩生梔黃連甘草牡丹皮柏葉茅根煎吃口瘡門口者脾之竅唇內應乎脾小兒鵝口者口內白屑滿舌上如鵝之口者此為胎熱而心脾最甚重發於口也當內服涼驚丸外用鵝口中涎以絹包手指洗淨以保命散吹之此亦名口瘡口瘡者滿口赤瘡此因胎稟本厚養育過溫心脾積熱熏蒸於上以成口瘡內服涼驚丸外用地雞即扁蟲人家房內磚下多有之擂水遍塗瘡上又以一連散敷之以上二症如服涼驚丸不效洗心散一服如神口糜者滿口生瘡潰爛乃膀胱移熱於小腸膈腸不便上為口糜以導赤散去小腸熱五苓散去膀胱熱當以導赤散調五苓散主之口瘡服涼藥不效乃肝脾氣不足虛火泛上而無制用理中湯治之外用官桂末吹之吐瀉後口生瘡者亦是虛火理中湯主之小兒上齶有脹起如懸癰者此名重齶由脾胃挾熱血氣不能收斂而成此者用針刺去惡血內服涼膈散外用碧雪散吹之輕者服涼驚丸小兒兩頤流涎浸潰胸前者此滯頤蓋涎者脾之液口為脾之竅由脾胃虛冷不能收斂津液故涎從口出而潰於頤者宜溫脾丹主之小兒口頻撮者氣不和也蓋唇應乎脾氣乃肺之所生脾虛不能養子故口頻撮宜補其母則氣自和以異功散主之小兒口撮面青多哭者此臍下痛也理中湯主之初生因臍風口撮臍腹腫者不治小兒急散乳吃而口不吮乳者此心脾有熱瀉黃散治之保命欲一名朱礬散硃砂白枯礬各五錢牙硝五錢共為細末搽舌上一連散即瀉心湯黃連為末蜜水調敷洗心散白朮甘草當歸荊芥加生地大黃煨麻黃赤芍薄荷葉生薑引碧雪散蒲黃青黛硼砂火硝生甘草各等分為細末吹之溫脾丹木香半夏各五錢生薑一錢白朮一錢青皮一錢陳皮一錢共研末粽糊為丸米飲下異功散人參白朮茯苓甘草陳皮薑棗引食前溫服小兒鵝口口瘡重齶不能吮乳咽喉腫塞者用青黛散青黛散青黛二錢黃連黃柏各五錢牙硝一錢辰砂一錢雄黃硼砂牛黃各五分腦子一分共為細末先以薄荷汁拭口後擦藥入口每用二分半西江月小兒心脾積熱唇口舌上生瘡白為鵝口屑浮霜赤者石榴子樣上下口唇破裂令兒乳食難嘗洗心涼膈是奇方搽洗各宜停當舌病門舌尖屬心舌根屬脾重舌者心脾有熱也蓋心候乎舌而主血脾之脈絡出於舌下若心脾有熱則氣俱盛附舌根而重生一物形如舌而短小內服涼膈散外用針刺去惡血以蒲黃和黃柏敷之木舌者心脾積熱之氣上衝故令舌腫漸漸長大塞滿口中若不急救必致害人內服涼膈散以針刺去惡血用碧雪散和竹瀝敷之弄舌者脾臟微熱令舌絡緊時時餂舌勿冷藥及下之少以瀉黃散服之亦或飲水面無紅白色者此脾胃少津液故耳不可誤認為熱以白朮散主之面黃肌瘦五心煩熱弄舌者此疳症也集聖丸主之大病後用藥而舌弄者凶舌上生白苔者此丹田積熱也內服涼驚丸外用碧雪散治之舌上生黑苔者其熱已劇急以薄荷煎水洗之如紅者可治以涼膈散下之洗不紅者必死舌上生苔又加大熱者不可治十有九死吐泄後舌上生白苔者此虛熱也理中湯主之涼膈散連翹山梔仁大黃薄荷葉黃芩甘草芒硝薑汁少許引西江月小兒重舌木舌心脾蘊熱攻中舌下生舌兩重重木舌大硬腫痛急用針刺去血何妨鮮血流紅枯礬搽上有神功解熱消風可用牙齒門上片牙屬胃下片牙屬大腸齒屬腎凡齒生遲者腎氣不足也蓋腎主骨齒者骨之餘腎不足則髓虧髓虧則不能充乎齒所以齒生遲也以地黃丸治之上下齒床腫者此陽明實熱也涼膈散以酒蒸大黃為君加知母石膏升麻為佐頻頻含咽重齦者腎臟積熱附齦腫痛謂之重齦以針刺去其血用鹽湯洗淨黃柏末敷之小兒多食肉牙齒臭息不可近者此陽明有熱也內服神效丸外用薑汁荊瀝含咽牙疳者狀如狐惑初作臭氣次則牙齒黑甚則齦肉爛而出血名曰宣露此由腎熱其氣奔上焦故以走馬為喻當速治之若上下唇破鼻穿牙齒落者此名崩砂氣喘痰潮飲食減少則不可治當內服黃柏丸外用如聖散敷之咬牙者風熱也由陽明大腸二經積熱熱則生風故令相擊而作聲必於夢中者蓋動則風散於表靜則風歸於里也宣風散主之上唇生瘡蟲食其臟曰惑下唇生瘡蟲食其肛曰狐出傷寒指掌之言狐惑者取其進退猶豫之義咬牙惟痘疹中有此者為危余無大害亦有因病戰栗鼓頷而鬥牙者治其病則自止矣牙齒落而不再生者由於舌舐之故其肉頑厚用針刺出血以鼠骨散擦之即生文蛤散治牙疳雄黃枯礬各五分五倍子二錢蠶蛻紙燒灰存性一錢共為末先以米泔水洗淨以藥搽上一日三四次以愈為度蠶蛻紙散治牙疳蠶蛻紙燒灰五分人中白燒過五分紅褐片燒灰五分白砒棗肉包燒煙盡取用一分共為末搽之神效丸蘭香葉當歸藿香葉木香各一錢升麻二錢生地酒洗甘草各二錢黃連酒炒砂仁各五錢共為末湯浸蒸餅為丸白湯送下黃柏丸黃柏半生半炒為末煉蜜丸白湯送下如聖散用婦人尿桶中白垢刮取煅盡煙一錢銅緑二分麝香半分共為末先以臘茶浸米泔水洗淨血後搽此藥宣風散檳榔二個陳皮甘草各兩半牽牛半生半炒共為末蜜水調食前服鼠骨散用雄鼠一隻爛盡肉取骨研末加麝香少許擦上用薑湯漱口西江月上下牙齦黑爛齦宣息露堪嗟敗唇穿鼻落齒牙迅速呼為走馬肉壞咽喉可畏啼聲漸變啞嗄又名狐惑兆非佳治𧈟回瘡無價咽喉門咽者胃脘主納水穀喉者肺管主氣出入為一身之總要若胸膈間蘊積熱毒致生風痰壅滯而不散發而為咽喉病名雖數種皆受熱毒宜速解熱毒緩則有難救之患輕則甘桔湯重則化毒湯主之如出痘瘡而咽喉痛者此毒氣上攻也加減甘桔湯主之喉中生瘡不能吮乳者化毒湯主之小兒為諸骨所哽骨大難咽者以鵝羽掃喉吐之骨小者用海上方及祝由科治之不治恐傷人誤吞麥芒者取鵝口中涎咽之即效甘桔湯桔梗甘草人參水煎細細吞之化毒湯桔梗五錢薄荷葉荊芥穗各二錢甘草二錢半朴硝一錢山豆根一錢半牙硝硼砂各二錢半雄黃辰砂各二錢為細末吹之或以水調服海上方用金鳳花根捶碎米醋煎用有嘴瓶盛之將口銜瓶嘴仰面咽之其骨即出吞時勿令沾牙用玉簪花根亦可或威靈仙根亦可俱如前法祝由科用淨水半碗一氣書龍師火帝七遍吞水即效西江月小兒咽喉部位一身軀命所關蘊積熱毒膈胸間致生風痰不散病雖數種各別治宜去痰為先後解風熱病斯痊遲有難救之患咽喉若然有疾治宜認其重輕輕者甘桔散先行重則化毒當進如或喉腫口噤開關散子宜熏喉風急救散通神吐痰消腫退病如患單雙蛾症治者不可胡行可針之症要用針不當針時要禁只用熏滲等藥退後依次施行蟾酥錠子點瘡疔瘡毒自消可幸形聲門發乃血之餘腎之苗也小兒發久不生雖生不黑而稀此由腎氣衰則血氣不足之故也地黃丸主之齒乃骨之餘骨者腎所主也齒久不生雖生而不齊者此腎虛故也地黃丸主之行遲者何也蓋骨乃髓之所養血氣不充則髓不滿骨故軟弱不能行此由腎與肝俱虛得之蓋肝主筋筋弱而不能早行腎主骨骨弱而不堅加味地黃丸主之腳細者稟受不足氣血不充故肌肉瘦薄骨節俱露如鶴之膝此亦由腎虛名鶴膝節加味地黃丸主之小兒大病後手足痿弱及驚風后手足痿緩並宜加減地黃丸主之語遲者由兒在胎之時母受驚邪之氣乘心兒感母氣心神不定不能榮舌故而語遲菖蒲丸主之凡吐泄及大病之後雖有聲而不能言又能進藥此外失音乃腎怯不能上接於陽也地黃丸主之有卒暴寒冷而聲不出者此肺風邪也加味瀉白散主之龜胸者其胸高腫狀如龜樣此肺熱也加減葶藶丸主之龜背者坐臥傴僂狀如龜背由客風吹脊入於骨髓此症多成痼疾間有灸肺俞二穴第三椎骨節下兩旁各寸半膈俞穴第七椎骨下兩旁各寸半如此而收功者然未盡見效也以枳殼丸主之地黃丸熟地黃酒蒸八錢山茱萸去核山藥各四錢澤瀉白茯苓丹皮各三錢腎弱失音者加巴戟去心石菖蒲各三錢煉蜜為丸麥冬湯下加味地黃丸虎脛骨酒炙生地黃酸棗仁炒肉桂防風白茯苓當歸如驚後得前症者加羌活煉蜜為丸白湯下菖蒲丸人參石菖蒲麥冬去心遠志肉薑汁炒川芎當歸各三錢滴乳香硃砂各一錢因於驚得者加牛膽南星三錢煉蜜為丸米飲下加減葶藶丸大黃煨天冬去心杏仁去皮尖另研百合桑白皮炒木通甜葶藶炒蜜丸滾白水送下囟顛詩七言乳食不常飢飽起寒熱積脾氣上衝致成此症隨輕重風熱相交未易攻治宜退熱疏風症瀉青丸子顯神功囟陷詩七言瀉泄久而氣血虛不能上衝元氣虧狗脊炙黃為細末雞蛋白調服即愈藥用參苓白朮散服之此症頃能除滯頤詩七言脾胃虛寒涎自流不能收斂漬頤謀半術薑陳青皮末一歲一丸米飲投語遲詩七言受胎母即有驚邪二氣乘心舌未加菖蒲茯神參遠志麥冬當歸乳香砂蜜丸粟大吞二十薄荷湯下可見瘥行遲詩七言肝腎二經俱不足肝主筋兮腎主骨若要二經氣血充加味地黃能助補龜胸詩五言小兒龜胸症肺熱脹如胸加減葶藶丸服之有神功龜背詩五言龜背為惡症腎風入骨髓內服枳殼丸灸法宜相繼發齒生遲詩七言發久不生生不黑齒久不生生不齊腎虛血弱成斯症地黃丸子俱能醫解顱四言句解顱八物有熱加連以綿系束香附白蘞鶴膝四言句小兒鶴膝此屬腎虛地黃加味服卻無虞諸瘡門小兒初生遍身生蟲瘡及流水瘡風瘡皆胎毒也切勿搽藥恐逼毒入腹宜服胡麻丸凡有誤用搽藥逼毒入腹以致腹脹者解毒丸主之凡有頭面遍身生瘡非干搽藥忽然自平加痰喘者切不可解利當以連翹湯治之以上數症俱是胎毒不可用灸法其有一歲以上生流水瘡者此血風瘡也胡麻丸主之痘瘡後生膿疱瘡者此痘風瘡以胡麻丸治之以上二症俱是風熱宜灸風池穴曲池穴血海穴足三里穴各灸三壯連翹湯連翹人參川芎黃連生甘草陳皮白芍木通水煎入竹瀝服小兒生癰毒腫癤者皆因氣血凝而熱乘之內服解毒湯外用貼藥如已潰者內服大補湯外用紫金錠塗之解毒湯玄參連翹升麻黃芩赤芍當歸羌活防風生地甘草荊芥穗祕結者加大黃木通大補湯人參黃耆川芎連翹白芷白茯苓當歸生地白朮甘草赤芍薑棗引紫金錠山慈姑三兩五倍子三兩大戟兩半續隨子肉一兩麝香三錢雄黃硃砂各一兩為末糯米糊作錠子磨水搽貼藥黃芩黃連黃柏各二錢大黃蒲黃各三錢血竭乳香各二分沒藥二分麝香少許共為末取生薑自然汁和雞蛋清打勻調藥貼之頭上生軟癤膿水不幹者用紫金錠搽之自愈用單方搽亦效單方用上好磁器不拘多少研為極細末雞子清調搽又方大枳殼一個去瓤令空磨令口平以麵糊塗抹枳殼四圍安貼於癤上自破膿血流盡先於一邊以燈草一根通之癤痊便無痕迹又方用石灰篩過以雞子清和灰為丸入炭火燒煉通紅如此捶和三次依法煅煉取研細香油調敷頸上生核腫脹發熱者內服連翹丸外用五倍子為末淡米醋調敷一日二次易之效連翹丸連翹桑白皮白頭翁牡丹皮防風黃柏肉桂豆豉獨活秦艽各五錢海螵蛸三錢半為末煉蜜丸燈心湯下西江月小兒遍身瘡疥蟲窠膿血浸淫此由胎毒內藏深故有許多形症涼血殺蟲解毒胡麻丸子通神切防搽洗毒歸心腹痛神昏命盡若是要用搽藥瘙癢無過蛇床𧈟蟲作楚用雄黃痛腫寒水為當不癢須加狗脊喜鹽湯火硫磺斑蝥同研熟尤良手擦鼻聞搽上丹毒門小兒赤遊丹毒雖有十種皆由心火內盛熱與血搏或起於手足或發於頭面胸背遊移上下其熱如火痛不可言赤如丹砂故名丹毒自腹出四肢者易治自四肢入腹者難治療此症者其法必先用表藥以解熱毒方可搽敷若遽用藥搽使氣無所泄而入於裡傷人者多矣小兒丹毒一歲以上者易治未周歲者難治有因驚後而發丹者此毒氣由內出外易治有先發丹而後驚者此毒氣由外入內者多死不治一從頭項起者名飛灶丹二從頭上起者名走灶丹三從面上起者名鬼火丹四從背上起者名天火丹五從兩手起者名天灶丹六從兩脅起者名水丹七從臍起者名葫蘆丹八從兩腳起者名野火丹九從兩腳背起者名煙火丹十從陰上起者名胡漏丹飛灶丹先用蔥白取自然汁搽走灶丹紅腫痛用赤小豆末雞子清調擦鬼火丹用伏龍肝雞子清調搽天火丹用桑白皮末羊脂調搽天灶丹用柳木燒灰水調搽水丹用生鐵鏽末豬油調搽葫蘆丹用檳榔末米醋調搽野火丹用乳香末羊脂調搽煙火丹用豬槽下土清油調搽胡漏丹用屋漏處的土羊脂調搽以上十種丹毒俱先服防風升麻湯以解其毒次用蜞針法以去其毒血如無蜞針用砭針法然後用救急法防風升麻湯防風升麻山梔仁甘草麥冬去心荊芥穗木通葛根薄荷葉玄參連翹牛蒡子便祕者加大黃水煎服蜞針法用水蜞數條放於紅腫處令吃出毒血立愈砭針法用磁瓦片打成尖鋒以筷子夾定扎住連刺令出惡血急救法取灶心對鍋底焦土研末以新汲水調搽干則易之小兒丹毒腹脹氣喘悶亂不乳反驚搐者皆不可治小兒生後百日之內半歲以上忽兩眼胞紅暈微起面青黯色夜則煩哭或臉如胭脂此因伏熱在內發之於外初則滿面狀如水痘腳微紅而不壯出沒休息無定次至頸項赤如丹砂名為驚丹以三解散治之三解散人參防風天麻鬱金茯神白附子大黃黃芩殭蠶全蠍枳殼薄荷葉粉草赤芍燈心引小兒驚風后風從氣行血從氣使毒氣蓄於皮膚流為腫毒多在腮頰耳根間成癰成癤謂之毒風宜內服當歸百解散外用拂毒散敷之當歸百解散當歸赤芍大黃川芎升麻薄荷葉乾葛麻黃黃芩甘草枳殼皂角刺蔥薑引拂毒散半夏一錢貝母大黃朴硝五倍子各二錢半共為末淡醋調敷患處干則易之小兒或因跌僕刀斧破傷皮膚風邪侵襲傷處發此謂之破傷風宜內服疏風活血散外以紫金丹塗之疏風活血散當歸生地川芎赤芍荊芥防風甘草紅花蘇木水煎服入酒少許西江月小兒赤遊丹毒雖有十種原根皆由心火熱多深上下遊移不定其色渾如丹石故稱丹毒之名治法方册甚分明全在醫家體認小兒流丹最毒十種發出不同自上而下莫至胸自下至腎可慟半周之內休見滿周病此宜攻蜞針的的有神功內解外敷兼用內解歸梢赤芍羌活荊芥防風升麻甘草地黃通竹葉玄參煎用外用益元敷貼更加寒水相同三朝五日急相攻驚搐靈丹如夢治丹用功次第從頭一一鋪陳解表下毒藥先行次用蜞針吮進若是蜞針不便須臾急用砭針然後塗藥救孩身此法前人已定捷法先須解毒或將利藥疏通初起塗敷莫胡攻毒入於裡遏壅解毒無價散子防風升麻湯同利藥靈應有神功只在醫人善用經驗治丹妙法而今説與後人先將靈應滌病身下後才施塗潤田螺搗餅敷貼或用水調灶心又將南星大黃停芒硝研勻水浸烘熱衣與兒火丹遂成之芒硝寒水石青黛石膏奇赤痣因何起胎中受熱多原來無大害不必請醫和斑疹癮疹門小兒斑疹其焮腫於外者屬少陽相火也謂之斑紅點在皮膚之中不出者屬少陰君火也謂之疹其症有陰陽輕重之別陽斑用托裡消熱化斑涼血此急治其標也陰疹用調中溫胃其疹自消此緩則治其本也大抵安里之藥多發表之藥少首尾不可妄下陽毒者或發於面部或發於背部或發於四肢極其稠密狀如錦紋紅赤者胃熱也紫黑者胃爛也一則下之早其熱乘虛而入胃一則下之晚其胃熱不得發越當服消斑青黛飲陰疹者或出胸背手足稀而小者此由失守之火聚於胸中上熏於肺傳於皮膚而成斑點如蚊蚋蚤蝨所咬而非錦紋也宜服理中湯治之其火自降其斑自退矣斑疹若自吐瀉者慎勿亂治因其毒氣上下皆出宜調中氣若吐瀉之後遍身發斑如錦紋者此熱即乘虛入胃其症多得於夏天化斑湯主之消斑青黛飲黃連甘草石膏知母柴胡山梔仁玄參升麻生地黃芩人參青黛生薑三片豆豉二十粒引調中湯蒼朮陳皮砂仁白芍炒甘草炙藿香葉桔梗半夏白芷羌活枳殼川芎薑三片引化斑湯人參石膏知母甘草水竹葉粳米引如斑紅者易治黑者難治小兒癮疹多屬於脾以其隱隱在皮膚之間發而多癢或不紅者並風與濕而成也加味羌活散治之或加減攻毒散亦效加味羌活散羌活前胡人參桔梗甘草薄荷葉枳殼川芎天麻茯苓蟬蛻薑三片引加減攻毒散羌活獨活前胡柴胡當歸川芎枳殼桔梗茯苓人參甘草薄荷葉防風荊芥蒼朮芍藥生地薑棗引續諸瘡驗方小兒眉叢中生瘡浸淫不幹者名曰鏈銀瘡用穿山甲前膊上甲炙焦為末入輕粉少許清油調敷凍耳成瘡者內服防風通聖散外用鉛粉以水擂細將艾揉爛焚成烏色研末敷之防風通聖散防風川芎當歸薄荷葉大黃炒山梔仁赤芍麻黃去節連翹石膏黃芩桔梗滑石荊芥白朮甘草加乾葛生薑引身上生瘡如粟米大成塊成路極痛者此名龍纏瘡用珍珠鳳尾草搗汁搽之又以渣調清油敷之效又驗方取糯米不拘多少浸脹擂漿澱粉搽之治天疱瘡方以韭菜地蚯蚓糞炒乾研極細蜜調搽小兒手足生瘡瘡頭黑破流黃水四畔浮漿極痛者此名魚臍瘡用蛇皮燒存性研細末雞子清清油調搽陰囊生瘡潰爛皮脆子欲墜者此名脆囊症乃濕熱也用紫蘇葉為末濕則滲之干則清油調搽又方用牆中白螺殼子為末敷之凡小兒不論癰毒瘡癤及無名惡瘡破傷血出與諸蟲咬螫者並用紫金錠水磨化內服外塗效不可言有頭頂上生瘡似流水而非流水者以遠年鐵磨水搽之其效如神又治流水瘡方鹽一鍾麥麩一鍾少將水和勻如彈子大放炭火上燒灰存性如瘡濕則干搽瘡干以清油調搽之祕傳十三方抱龍丸抱者養也龍者純陽之物也小兒純陽無陰所以病則有熱熱則生風必用此藥所以養其陰而濟之令不太過也又青龍位肝木屬之小兒肝常有餘脾常不足故以此藥抑肝扶脾乃名抱龍治形實壯熱昏睡氣粗或痰壅嗽驚風搐搦牛膽南星五錢臘月取牛膽一個將南星去皮臍研為末放於牛膽中陰乾備用天竺黃辰砂各一錢琥珀三分牛黃二分麝香半分珍珠三分白檀香三分枳實枳殼各三分共為末山藥打糊為丸如黃豆大金箔為衣潮熱燈心湯化下驚風薄荷湯下咳嗽白開水化下涼驚丸退五臟熱瀉心肝火治急驚解胎毒如小便黃大便祕丹毒斑疹衄血口瘡並皆治之黃連五錢瀉心火黃芩五錢瀉肺火山梔仁五錢瀉肝火黃柏五錢瀉腎火大黃二錢瀉脾胃火龍膽草三錢瀉膽火雄黃解毒辰砂鎮心各二錢共為末水糊丸如粟米大竹葉燈心湯下急驚薄荷燈心湯下胎熱竹葉燈心湯下衄血茅花湯下丹毒斑疹升麻湯下口瘡水竹葉薄荷湯下胃苓丸分陰陽退潮熱止吐泄消浮腫黃疸調脾胃止便濁小兒常用之藥也蒼朮米泔水浸去黑皮焙乾五錢陳皮五錢厚朴薑汁炒五錢白朮五錢粉草炙二錢豬苓三錢澤瀉三錢白茯苓三錢草果仁二錢官桂一錢共為末水糊丸如粟米大炒米湯下嘔吐煨薑湯下調胃炒米湯下白濁鹽湯下瀉泄炒米車前草湯下潮熱水竹葉炒米湯下浮腫長流水燈心五加皮湯下疝氣茴香湯下黃疸加茵陳五錢燈心湯下養脾丸治小兒脾胃虛弱不思乳食傷食癖積面色黃嘔吐泄瀉腹痛膨脹並皆治之蒼朮制五錢厚朴三錢陳皮五錢砂仁二錢草果仁二錢神麯炒三錢益智仁二錢茯苓三錢麥芽炒三錢共為末酒糊丸如粟米大米飲下嘔吐煨薑湯下脾胃虛弱米湯下食積山楂湯下腹痛茴香湯下腫脹蘿蔔湯下寒泄薑棗湯下胡麻丸治小兒風瘡疥癬苦參五錢何首烏胡麻仁炒蔓荊子炒威靈仙荊芥穗白蒺藜炒去刺牛蒡子炒各三錢石菖蒲一錢五分干菊花三錢共為末酒糊為丸如粟米大竹葉燈心湯下神芎丸治小兒上焦積熱驚風壅滯頭目赤腫咽閉大小便赤澀及痰喘之症並皆治之大黃酒蒸黃芩各一錢黑牽牛頭末滑石各四錢黃連川芎薄荷葉各五錢共為末滴水為丸如粟米大竹葉湯下玉液丸治風壅化痰利膈清頭目煩熱除咳嗽寒水石火煅水飛二兩半夏制一兩枯礬五錢共為末米糊丸如粟米大薑湯下感風寒咳嗽桑白皮湯下咳血茅根湯下常咳茶湯下咳而吐煨薑湯下茱萸內消丸治偏墜膀胱疝氣及內瘹驚啼哭不止山茱萸五錢桔梗川芎各三錢小茴香炒五錢陳皮青皮白蒺藜炒去刺川楝子去核各五錢吳茱萸炒肉桂各三錢木香二錢枳實炒一錢桃仁三錢大腹皮酒洗海藻玄胡索炒各五錢五味子一錢共為末酒糊丸如粟米大茴香湯下久不愈者鹽湯下香連丸治赤白痢相雜裡急後重黃連吳茱萸炒五錢廣木香五錢石蓮肉三錢久痢不止者加肉豆蔻麵包煨去油五錢共為末醋糊丸如粟米大陳米湯送下雄黃解毒丸下痰去熱追蟲打積雄黃一錢另研鬱金三錢巴豆霜二錢共為末米糊丸如粟米大痰涎壅甚竹葉湯下積痛茴香湯下纏喉風滾白水化開吐痰蟲痛苦楝子根白皮湯下先以雞蛋油煎空心時令兒聞之然後服藥必要上半月謂其蟲之頭向上故也至聖保命丹治急慢驚風夜啼常服清心安神全蠍十四個蟬蛻去翅足一錢使君子肉煨五分麝香半分辰砂一錢天麻二錢膽星二錢防風一錢殭蠶炒二錢白附子炮一錢珍珠五分金箔四十張共為末粟米粉糊和勻印成錠子薄荷湯磨服驚風薄荷燈心湯下夜啼燈心燒灰化溫水下一粒丹治小兒水泄寒水石二兩枯礬一兩共為末水和丸如緑豆大每服一丸米湯下斬鬼丹治小兒大人瘧疾黃丹水飛曬乾一兩獨蒜大者七個搗爛和丹為丸取端午日修合如緑豆大勿令婦人雞犬孝服見之每於發瘧日五更用桃枝長流水煎湯面向東方服一丸其效如神
